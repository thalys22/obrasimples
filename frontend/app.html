<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Prumo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2030%2030%22%20fill%3D%22none%22%3E%3Crect%20width%3D%2230%22%20height%3D%2230%22%20rx%3D%227%22%20fill%3D%22%231C2533%22%2F%3E%3Cpath%20d%3D%22M10%2023V7h6.2a4.8%204.8%200%200%201%200%209.6H10%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.6%22%20fill%3D%22none%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M19.5%2016.6V21%22%20stroke%3D%22%23E07B24%22%20stroke-width%3D%221.5%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2219.5%22%20cy%3D%2222.6%22%20r%3D%222%22%20fill%3D%22%23E07B24%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  /* Layout: plataforma — trilho de ícones escuro à esquerda, cabeçalho branco com busca e notificações, menu do módulo em árvore, conteúdo em cartões sobre cinza claro. Tema claro único, por escolha. */
  :root{
    color-scheme: light;
    --ink:#1C2533;
    --ink-2:#3A4555;
    --paper:#F3F4F6;
    --paper-2:#EBEDF0;
    --white:#FFFFFF;
    --rail:#1C2533;
    --rail-ink:#A9B4C2;
    --accent:#E07B24;
    --accent-soft:#FCEFE3;
    --blueprint:#2B5C8A;
    --blueprint-deep:#1D4166;
    --blueprint-soft:#E6EEF6;
    --concrete:#687384;
    --amber:#E2A33A;
    --amber-soft:#FBEED5;
    --amber-ink:#6B4A0C;
    --red:#C2443A;
    --red-soft:#F8E0DD;
    --red-ink:#7A2A24;
    --green:#2F7D52;
    --green-soft:#DFF0E6;
    --line:#E3E6EA;
    --line-strong:#C9CED6;
    --tile-teal:#76C5C9;
    --tile-coral:#EE8576;
    --tile-amber:#F3B34C;
    --tile-blue:#8FB9E6;
    --tb-muted:#A9B4C2;
    --menu-bg:#1F4A35;
    --menu-ink:#D5E6DC;
    --menu-muted:#9EC2AD;
    --menu-line:rgba(255,255,255,0.14);
    --menu-hover:rgba(255,255,255,0.07);
    --menu-active:rgba(255,255,255,0.13);
    --font-display:'Inter', system-ui, sans-serif;
    --font-body:'Inter', system-ui, sans-serif;
    --font-mono:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:var(--paper);color:var(--ink);font-size:14px;}
  ::selection{background:var(--blueprint);color:var(--white);}
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, label:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  /* ---------- Cabeçalho ---------- */
  .frame{min-height:100vh;display:flex;flex-direction:column;}
  .topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;min-height:60px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:8px 20px;}
  .brand{display:flex;align-items:center;gap:9px;flex-shrink:0;}
  .brand b{font-size:19px;font-weight:800;letter-spacing:-0.3px;color:var(--ink);line-height:1;}
  .brand small{display:block;font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--concrete);margin-top:2px;}
  .obra-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 10px;background:var(--paper);font:inherit;font-size:12.5px;color:var(--ink-2);cursor:pointer;min-width:0;max-width:340px;}
  .obra-chip:hover{border-color:var(--line-strong);}
  .obra-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .obra-chip i{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:6px;}
  .search{position:relative;width:min(340px, 34vw);}
  .search input{width:100%;height:38px;border:1px solid var(--line-strong);border-radius:999px;padding:0 14px 0 38px;font:inherit;font-size:13.5px;color:var(--ink);background:var(--white);}
  .search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--concrete);pointer-events:none;}
  .dropdown{position:absolute;top:calc(100% + 6px);right:0;left:0;background:var(--white);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px rgba(16,24,40,0.14);z-index:45;max-height:min(420px, 70vh);overflow:auto;padding:6px 0;}
  .dropdown.wide{left:auto;width:min(380px, calc(100vw - 32px));}
  .dd-item{display:block;width:100%;text-align:left;border:none;background:none;padding:9px 14px;font:inherit;cursor:pointer;color:var(--ink);}
  .dd-item:hover, .dd-item.sel{background:var(--paper);}
  .dd-item b{display:block;font-size:13.5px;font-weight:600;}
  .dd-item small{display:block;font-size:11.5px;color:var(--concrete);margin-top:1px;}
  .dd-empty{padding:12px 14px;font-size:12.5px;color:var(--concrete);}
  .dd-head{padding:8px 14px 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--concrete);}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:none;background:none;color:var(--ink-2);display:grid;place-items:center;cursor:pointer;position:relative;flex-shrink:0;}
  .icon-btn:hover{background:var(--paper);}
  .icon-btn .dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:var(--white);font-size:10px;font-weight:700;display:grid;place-items:center;}
  .menu-toggle{display:none;}
  .icon-btn.avatar{background:var(--menu-bg);color:var(--white);font-weight:700;font-size:13px;margin-left:4px;}
  .icon-btn.avatar:hover{background:#163826;}
  a.dd-item{text-decoration:none;}
  body.busy{cursor:progress;}
  body.busy button.primary, body.busy .danger-btn{opacity:.6;pointer-events:none;}
  .notif-wrap{position:relative;}

  /* ---------- Menu do módulo ---------- */
  .body{display:flex;flex:1;min-height:0;}
  .menu{width:270px;flex-shrink:0;background:var(--menu-bg);color:var(--menu-ink);border-right:1px solid var(--menu-bg);position:sticky;top:60px;align-self:flex-start;height:calc(100vh - 60px - 30px);overflow:auto;padding:4px 0 20px;}
  .menu-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;font-weight:700;font-size:16px;color:var(--white);border-bottom:1px solid var(--menu-line);margin-bottom:6px;}
  .menu-head button{border:none;background:none;color:var(--menu-muted);cursor:pointer;padding:4px;border-radius:4px;}
  .menu-head button:hover{background:var(--menu-hover);color:var(--white);}
  details.mgroup > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 16px;font-weight:700;font-size:13.5px;color:var(--white);}
  details.mgroup > summary:hover{background:var(--menu-hover);}
  details.mgroup > summary::-webkit-details-marker{display:none;}
  details.mgroup > summary::before{content:'';width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--menu-muted);transform:rotate(-90deg);transition:transform .12s;}
  details.mgroup[open] > summary::before{transform:none;}
  .mitem{display:flex;align-items:center;width:calc(100% - 32px);margin-left:32px;text-align:left;border:none;border-left:1px solid var(--menu-line);background:none;padding:8px 12px;font:inherit;font-size:13.5px;color:var(--menu-ink);cursor:pointer;}
  .mitem:hover{background:var(--menu-hover);color:var(--white);}
  .mitem.active{color:var(--white);font-weight:600;border-left:2px solid var(--accent);background:var(--menu-active);}
  .mitem .badge{margin-left:auto;background:var(--red);color:var(--white);font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;}
  .frame.menu-collapsed .menu{display:none;}
  .menu-reopen{display:none;}
  .frame.menu-collapsed .menu-reopen{display:inline-grid;}

  main{flex:1;min-width:0;padding:24px 28px 48px;background:var(--paper);}
  .crumb{font-size:12px;color:var(--concrete);margin-bottom:6px;}
  .crumb b{color:var(--ink-2);font-weight:600;}
  .section-title{font-family:var(--font-display);font-weight:700;font-size:24px;margin:0 0 4px;color:var(--ink);letter-spacing:-0.2px;text-wrap:balance;}
  .section-sub{font-size:13px;color:var(--concrete);margin:0 0 18px;}
  .statusbar{position:sticky;bottom:0;height:30px;display:flex;align-items:center;justify-content:flex-end;gap:14px;border-top:1px solid var(--line);background:var(--white);font-size:11.5px;color:var(--concrete);padding:0 20px;z-index:10;white-space:nowrap;overflow:hidden;}
  .scrim{position:fixed;inset:0;background:rgba(28,37,51,0.4);z-index:34;}

  @media (max-width:860px){
    .topbar{flex-wrap:wrap;gap:8px;padding:8px max(16px, env(safe-area-inset-right,0px)) 8px max(16px, env(safe-area-inset-left,0px));}
    .menu-toggle{display:grid;}
    #obra-wrap{display:none;}
    .top-right{flex:1 1 100%;order:3;margin-left:0;}
    .search{flex:1;width:auto;}
    .menu{position:fixed;top:0;left:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);height:auto;width:min(300px, 86vw);z-index:35;transform:translateX(-105%);transition:transform .18s;box-shadow:8px 0 24px rgba(16,24,40,0.18);padding-top:env(safe-area-inset-top,0px);}
    .frame.menu-open .menu{transform:none;}
    .frame.menu-collapsed .menu{display:block;}
    .menu-reopen, .frame.menu-collapsed .menu-reopen{display:none;}
    main{padding:18px 16px 32px;}
    .statusbar{display:none;}
    .dropdown.wide{position:fixed;top:112px;left:16px;right:16px;width:auto;}
  }
  @media (prefers-reduced-motion: reduce){.menu{transition:none;}}

  /* ---------- Mural (início) ---------- */
  .home-hello{font-size:24px;font-weight:700;margin:0 0 4px;letter-spacing:-0.2px;}
  .home-top{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;margin-bottom:22px;}
  .home-row{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:18px;margin-bottom:18px;}
  @media(max-width:1180px){.home-top{grid-template-columns:1fr;}}
  @media(max-width:900px){.home-row{grid-template-columns:1fr;}}
  .mural-title{font-size:19px;font-weight:700;margin:4px 0 12px;}
  .panel{background:var(--white);border:1px solid var(--line);border-radius:8px;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
  .panel-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);}
  .panel-head h3{margin:0;font-size:16px;font-weight:700;}
  .panel-head .more{margin-left:auto;}
  .tile{width:38px;height:38px;border-radius:6px;display:grid;place-items:center;color:var(--white);flex-shrink:0;}
  .tile.teal{background:var(--tile-teal);} .tile.coral{background:var(--tile-coral);} .tile.amber{background:var(--tile-amber);} .tile.blue{background:var(--tile-blue);} .tile.green{background:#7CC59A;}
  .plist{max-height:300px;overflow:auto;}
  .prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);background:none;padding:11px 16px;font:inherit;color:var(--ink);cursor:pointer;}
  .prow:last-child{border-bottom:none;}
  .prow:hover{background:var(--paper);}
  .prow .pt{flex:1;min-width:0;}
  .prow b{display:block;font-size:13.5px;font-weight:600;}
  .prow small{display:block;font-size:12px;color:var(--concrete);margin-top:2px;}
  .prow .star{color:var(--line-strong);flex-shrink:0;}
  .prow .val{font-size:13px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .datebox{width:46px;flex-shrink:0;text-align:center;line-height:1.1;}
  .datebox b{font-size:18px;font-weight:700;}
  .datebox small{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin:0;}
  .datebox.late b, .datebox.late small{color:var(--red);}
  .psep{background:var(--paper);text-align:center;font-size:12px;font-weight:600;color:var(--ink-2);padding:7px;border-bottom:1px solid var(--line);}
  .pempty{padding:20px 16px;font-size:13px;color:var(--concrete);}
  .quick{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:10px;padding:14px 16px;}
  .quick button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--white);padding:12px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;}
  .quick button:hover{border-color:var(--accent);background:var(--accent-soft);}
  .quick button svg{color:var(--accent);flex-shrink:0;}
  @media(max-width:420px){.quick{grid-template-columns:1fr;}}
  .hero .cta{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;}
  .hero .cta button{background:var(--accent);color:var(--white);border:none;border-radius:999px;padding:9px 18px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;}
  .hero .cta button.alt{background:transparent;border:1px solid #4A5A70;color:var(--white);}

  /* ---------- Cards ---------- */
  .grid{display:grid;gap:18px;}
  .grid > *{min-width:0;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:2fr 1fr;}
  @media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:1fr;}.grid-2{grid-template-columns:1fr;}}
  @media(max-width:420px){.grid-4{grid-template-columns:1fr;}}

  .card{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:18px 20px;min-width:0;}
  @media(max-width:760px){.card{padding:14px;}}
  .card h3{margin:0 0 14px;font-family:var(--font-display);font-weight:700;font-size:15.5px;color:var(--ink);}
  .metric-card{padding:16px 18px;}
  .metric-label{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--concrete);margin-bottom:8px;}
  .metric-value{font-family:var(--font-display);font-weight:700;font-size:28px;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;}
  .metric-value.small{font-size:22px;}
  .metric-foot{font-family:var(--font-mono);font-size:11px;color:var(--concrete);margin-top:6px;}
  .metric-value.danger{color:var(--red);}
  .metric-value.warn{color:var(--amber);}
  .metric-value.ok{color:var(--green);}

  /* ---------- Régua de avanço ---------- */
  .ruler-wrap{margin:6px 0 2px;}
  .ruler-labels{display:flex;justify-content:space-between;gap:8px;font-family:var(--font-mono);font-size:11px;color:var(--concrete);margin-bottom:4px;}
  .ruler-labels b{color:var(--ink);font-weight:600;}
  .ruler-bar{position:relative;height:22px;background:var(--paper);border:1px solid var(--line-strong);border-radius:2px;overflow:hidden;}
  .ruler-bar::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(90deg, var(--line-strong) 0, var(--line-strong) 1px, transparent 1px, transparent 10%);z-index:2;pointer-events:none;}
  .ruler-bar::after{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(90deg, var(--ink) 0, var(--ink) 1.5px, transparent 1.5px, transparent 50%);opacity:0.35;z-index:2;pointer-events:none;}
  .ruler-fill{position:absolute;top:0;left:0;bottom:0;background:var(--blueprint);transition:width .5s ease;z-index:1;}
  .ruler-fill.warn{background:var(--amber);}
  .ruler-fill.danger{background:var(--red);}
  .ruler-fill.ok{background:var(--green);}
  .ruler-pct{position:absolute;top:0;right:6px;height:100%;display:flex;align-items:center;font-family:var(--font-mono);font-size:10.5px;font-weight:600;color:var(--ink);z-index:3;text-shadow:0 0 4px var(--white), 0 0 4px var(--white);}
  @media (prefers-reduced-motion: reduce){.ruler-fill{transition:none;}}

  .tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--concrete);padding:8px 10px;border-bottom:2px solid var(--line-strong);white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .mono{font-family:var(--font-mono);}
  tr.origem-row td{background:var(--paper);padding:6px 10px 12px;}
  .origem-list{display:grid;gap:4px;font-size:12px;}
  .origem-list div{display:flex;gap:10px;flex-wrap:wrap;}
  .origem-list .mono{color:var(--concrete);}
  .origem-list b{margin-left:auto;font-family:var(--font-mono);font-weight:600;}

  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:0.3px;white-space:nowrap;}
  .pill.ok{background:var(--green-soft);color:var(--green);}
  .pill.warn{background:var(--amber-soft);color:#8A5E10;}
  .pill.danger{background:var(--red-soft);color:var(--red);}
  .pill.neutral{background:var(--paper-2);color:var(--concrete);}

  /* ---------- Formulários ---------- */
  details.formbox{margin-top:16px;border:1px dashed var(--line-strong);border-radius:8px;background:var(--paper);scroll-margin-top:80px;}
  details.formbox > summary{cursor:pointer;padding:11px 14px;font-size:13px;color:var(--accent);font-weight:600;list-style:none;}
  details.formbox > summary::-webkit-details-marker{display:none;}
  details.formbox > summary::before{content:'+ ';}
  details.formbox[open] > summary::before{content:'– ';}
  .formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:4px 14px 16px;}
  .formgrid label{display:block;font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.6px;color:var(--concrete);margin-bottom:4px;}
  .formgrid input, .formgrid select{width:100%;padding:8px 9px;border:1px solid var(--line-strong);border-radius:3px;font-family:var(--font-body);font-size:14px;background:var(--white);color:var(--ink);}
  .formgrid input:focus, .formgrid select:focus{outline:none;border-color:var(--blueprint);}
  .formhint{padding:0 14px 10px;font-size:12.5px;color:var(--concrete);line-height:1.5;}
  .form-actions{padding:0 14px 16px;display:flex;gap:10px;flex-wrap:wrap;}
  button.primary{background:var(--accent);color:var(--white);border:none;border-radius:3px;padding:10px 18px;font-family:var(--font-body);font-weight:600;font-size:13px;cursor:pointer;}
  button.primary:hover{background:#C66A1C;}
  button.danger-btn{background:var(--red);color:var(--white);border:none;border-radius:3px;padding:10px 18px;font-family:var(--font-body);font-weight:600;font-size:13px;cursor:pointer;}
  button.ghost, label.ghost{display:inline-block;background:transparent;border:1px solid var(--line-strong);color:var(--ink);padding:6px 12px;border-radius:3px;font-family:var(--font-mono);font-size:11px;cursor:pointer;white-space:nowrap;}
  button.ghost:hover, label.ghost:hover{border-color:var(--blueprint);color:var(--blueprint);}
  button.link{background:none;border:none;padding:0;color:var(--blueprint);font-family:var(--font-mono);font-size:11px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
  button.link.del{color:var(--red);}

  .divider{height:1px;background:var(--line);margin:22px 0;position:relative;}
  .divider::after{content:'';position:absolute;left:0;right:0;top:-2px;height:5px;background-image:repeating-linear-gradient(90deg, var(--line-strong) 0 1px, transparent 1px 24px);}

  .alert-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:3px;font-size:12.5px;margin-bottom:8px;}
  .alert-row.danger{background:var(--red-soft);color:var(--red-ink);border-left:3px solid var(--red);}
  .alert-row.warn{background:var(--amber-soft);color:var(--amber-ink);border-left:3px solid var(--amber);}

  .alert-row .mono{margin-left:auto;font-weight:600;white-space:nowrap;}

  .empty{font-family:var(--font-mono);font-size:12px;color:var(--concrete);padding:18px;text-align:center;border:1px dashed var(--line-strong);border-radius:4px;background:var(--paper);line-height:1.5;}
  .helptext{font-size:12.5px;color:var(--concrete);margin:-6px 0 14px;line-height:1.5;}
  .link-tag{font-family:var(--font-mono);font-size:11px;color:var(--blueprint);background:var(--blueprint-soft);padding:3px 8px;border-radius:3px;white-space:nowrap;}
  .card-flex-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .card-flex-head h3{margin:0;}

  /* ---------- Termos explicáveis ---------- */
  button.term{background:none;border:none;padding:0;font:inherit;color:inherit;cursor:help;text-decoration:underline dotted var(--blueprint);text-underline-offset:3px;text-transform:inherit;letter-spacing:inherit;}
  button.term:hover{color:var(--blueprint);}

  /* ---------- Caixa "para que serve" ---------- */
  details.intro{background:var(--blueprint-soft);border:1px solid #C9D6E2;border-radius:8px;margin-bottom:20px;}
  details.intro > summary{cursor:pointer;list-style:none;padding:12px 16px;font-weight:600;font-size:13.5px;color:var(--blueprint-deep);display:flex;align-items:center;gap:10px;}
  details.intro > summary::-webkit-details-marker{display:none;}
  details.intro > summary::before{content:'i';display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--blueprint);color:var(--white);font-family:var(--font-mono);font-size:11px;font-weight:700;flex-shrink:0;}
  details.intro > summary::after{content:'mostrar';margin-left:auto;font-family:var(--font-mono);font-size:10.5px;font-weight:500;color:var(--blueprint);}
  details.intro[open] > summary::after{content:'esconder';}
  .intro-body{padding:0 16px 14px 46px;font-size:13.5px;line-height:1.6;color:var(--ink-2);max-width:78ch;}
  .intro-body p{margin:0 0 8px;}
  .intro-body ul{margin:0 0 8px;padding-left:18px;}
  .intro-body .auto{font-family:var(--font-mono);font-size:12px;color:var(--blueprint-deep);background:var(--white);border:1px solid #C9D6E2;border-radius:3px;padding:8px 10px;margin-top:6px;}
  @media(max-width:760px){.intro-body{padding-left:16px;}}

  /* ---------- Guia ---------- */
  .guide-lead{font-size:16px;line-height:1.6;max-width:68ch;margin:0 0 22px;color:var(--ink-2);}
  .flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;margin:6px 0 4px;}
  .flow-step{flex:1 1 170px;min-width:0;background:var(--white);border:1px solid var(--line);border-radius:4px;padding:12px 14px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:4px;}
  .flow-step:hover{border-color:var(--blueprint);}
  .flow-step .n{font-family:var(--font-mono);font-size:10.5px;color:var(--blueprint);letter-spacing:0.8px;text-transform:uppercase;}
  .flow-step b{font-family:var(--font-display);font-size:16px;font-weight:700;}
  .flow-step span{font-size:12.5px;color:var(--concrete);line-height:1.45;}
  .flow-arrow{display:grid;place-items:center;width:28px;flex-shrink:0;color:var(--line-strong);font-family:var(--font-mono);font-size:18px;}
  @media(max-width:760px){.flow{flex-direction:column;}.flow-arrow{width:auto;height:22px;transform:rotate(90deg);}}
  .callout{border-left:3px solid var(--amber);background:var(--white);padding:14px 16px;border-radius:0 4px 4px 0;font-size:13.5px;line-height:1.6;max-width:78ch;}
  .callout b{display:block;margin-bottom:4px;}
  ol.tour{margin:0;padding:0;list-style:none;counter-reset:tour;display:grid;gap:10px;}
  ol.tour li{counter-increment:tour;display:flex;gap:12px;align-items:flex-start;background:var(--white);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:13.5px;line-height:1.5;}
  ol.tour li::before{content:counter(tour);font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--blueprint);line-height:1;min-width:18px;}
  ol.tour li > div{flex:1;min-width:0;}
  ol.tour li button{margin-top:6px;}
  dl.glossary{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin:0;}
  dl.glossary div{background:var(--white);border:1px solid var(--line);border-radius:4px;padding:10px 12px;}
  dl.glossary dt{font-weight:700;font-size:13.5px;margin-bottom:3px;}
  dl.glossary dd{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.5;}

  /* ---------- Destaque: avanço geral ---------- */
  .hero{background:var(--ink);color:var(--white);border-radius:8px;padding:22px 26px;margin-bottom:18px;border:1px solid var(--blueprint-deep);}
  @media(max-width:760px){.hero{padding:16px;}}
  .hero-top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .hero-top h3{margin:0;font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--white);}
  .hero-top .mono{color:var(--tb-muted);font-size:12px;}
  .hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  @media(max-width:800px){.hero-grid{grid-template-columns:1fr;}}
  .hero-note{font-size:12px;color:#B7C4CC;margin-top:6px;line-height:1.45;}
  .hero .ruler-labels{color:#B7C4CC;}
  .hero .ruler-labels b{color:var(--white);}
  .hero .ruler-bar{border-color:#3C5468;background:#1F3140;}
  .hero .ruler-bar::before{background-image:repeating-linear-gradient(90deg, #3C5468 0, #3C5468 1px, transparent 1px, transparent 10%);}
  .hero .ruler-bar::after{background-image:repeating-linear-gradient(90deg, #6E8598 0, #6E8598 1.5px, transparent 1.5px, transparent 50%);}
  .hero .ruler-pct{color:var(--white);text-shadow:none;}
  .hero-figure{font-family:var(--font-display);font-weight:700;font-size:38px;letter-spacing:-0.5px;line-height:1;font-variant-numeric:tabular-nums;}

  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
  input[type=file]{display:none;}
  .nf-draft-table{width:100%;font-size:12.5px;margin:10px 0;}
  .nf-draft-table th, .nf-draft-table td{padding:5px 8px;}

  /* ---------- Aviso (toast) e confirmação ---------- */
  #toasts{position:fixed;right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));display:grid;gap:8px;z-index:110;width:min(380px, calc(100vw - 32px));}
  .toast{background:var(--ink);color:var(--white);border-radius:4px;padding:12px 14px 12px 16px;font-size:13px;line-height:1.5;box-shadow:0 6px 24px rgba(22,35,46,0.25);border-left:4px solid var(--blueprint);display:flex;gap:10px;align-items:flex-start;}
  .toast.ok{border-left-color:#6FB58A;}
  .toast.err{border-left-color:#E07A70;}
  .toast.info{border-left-color:var(--amber);}
  .toast .t-body{flex:1;min-width:0;}
  .toast .t-body b{display:block;margin-bottom:2px;}
  .toast ul{margin:4px 0 0;padding-left:16px;}
  .toast button{background:none;border:none;color:var(--tb-muted);cursor:pointer;font-size:16px;line-height:1;padding:0 2px;}
  #modal{position:fixed;inset:0;background:rgba(22,35,46,0.55);display:grid;place-items:center;z-index:100;padding:16px;}
  #modal[hidden]{display:none;}
  [id^="sec-"], [id^="form-"], #glossario{scroll-margin-top:80px;}
  .flash{animation:flash 1.4s ease;}
  @keyframes flash{0%{box-shadow:0 0 0 0 rgba(224,123,36,0.55);}100%{box-shadow:0 0 0 12px rgba(224,123,36,0);}}
  @media (prefers-reduced-motion: reduce){.flash{animation:none;}}
  #modal .box{background:var(--white);border-radius:6px;max-width:440px;width:100%;padding:20px 22px;box-shadow:0 12px 40px rgba(0,0,0,0.3);}
  #modal h4{margin:0 0 8px;font-family:var(--font-display);font-size:18px;font-weight:700;}
  #modal p{margin:0 0 16px;font-size:13.5px;line-height:1.55;color:var(--ink-2);}
  #modal .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
  /* ---------- Painel de edição (insumo, composição, serviço, etapa) ---------- */
  #painel{position:fixed;inset:0;background:rgba(20,28,40,0.45);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;}
  #painel[hidden]{display:none;}
  #painel .box{background:var(--white);border-radius:8px;max-width:760px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,0.3);}
  #painel .phead{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);}
  #painel .phead h4{margin:0;font-family:var(--font-display);font-size:18px;font-weight:700;flex:1;}
  #painel .phead button{background:none;border:none;font-size:22px;cursor:pointer;color:var(--concrete);line-height:1;}
  #painel .pbody{padding:14px 6px 4px;}
  #painel .pfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:12px 20px 18px;border-top:1px solid var(--line);}
  .comp-rows{padding:0 14px;}
  .comp-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 90px 28px;gap:8px;align-items:center;margin-bottom:8px;}
  .comp-row select, .comp-row input{width:100%;padding:7px 8px;border:1px solid var(--line-strong);border-radius:3px;font-family:var(--font-body);font-size:13.5px;background:var(--white);color:var(--ink);}
  .comp-row .sub{font-family:var(--font-mono);font-size:12px;text-align:right;white-space:nowrap;}
  .comp-row button{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;}
  .comp-head{display:grid;grid-template-columns:minmax(0,1fr) 110px 90px 28px;gap:8px;font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.6px;color:var(--concrete);padding:0 14px 4px;}
  @media(max-width:560px){.comp-row, .comp-head{grid-template-columns:minmax(0,1fr) 80px 28px;}.comp-row .sub, .comp-head .sub{display:none;}}
  .tag{display:inline-block;font-family:var(--font-mono);font-size:10px;font-weight:600;padding:1px 7px;border-radius:3px;white-space:nowrap;vertical-align:middle;}
  .tag.base{background:var(--blueprint-soft);color:var(--blueprint-deep);}
  .tag.obra{background:var(--accent-soft);color:#9A4F10;}
  .tag.ref{background:var(--amber-soft);color:#8A5E10;}
  .tag.sinapi{background:#E3EEF9;color:#1B4F80;}
  .tag.sp{background:var(--amber-soft);color:#8A5E10;}
  .sin-res tr{cursor:pointer;} .sin-res tr:hover{background:var(--paper);}
  .sin-aviso{margin:8px 0;padding:8px 10px;border-left:3px solid #C98A1B;background:var(--amber-soft);font-size:12.5px;}
  .tag.verba{background:var(--paper-2);color:var(--concrete);}
  .busca{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .busca input, .busca select{padding:7px 9px;border:1px solid var(--line-strong);border-radius:3px;font-family:var(--font-body);font-size:13.5px;background:var(--white);color:var(--ink);}
  .busca input{flex:1;min-width:180px;}
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden;margin:0 14px 12px;flex-wrap:wrap;}
  .seg label{padding:7px 12px;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center;}
  .seg label:has(input:checked){background:var(--accent-soft);color:#9A4F10;font-weight:600;}
  .preview{margin:0 14px 14px;border:1px solid var(--line);border-radius:6px;background:var(--white);padding:10px 12px;font-size:13px;}
  .preview .tot{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--font-mono);font-size:12px;margin-bottom:6px;}
  .preview .tot b{font-size:13.5px;color:var(--ink);}
  .mini{font-size:12px;}
  .mini td, .mini th{padding:5px 8px;}
  .codigo{font-family:var(--font-mono);font-size:11.5px;color:var(--concrete);white-space:nowrap;}
  .acoes{white-space:nowrap;text-align:right;}
  .acoes button + button{margin-left:10px;}
  .imp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
  .imp-card{border:1px solid var(--line);border-radius:6px;padding:14px;background:var(--paper);}
  .imp-card h4{margin:0 0 6px;font-size:14px;}
  .imp-card p{margin:0 0 10px;font-size:12.5px;color:var(--concrete);line-height:1.5;}
  .imp-card .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .imp-card select{padding:6px 8px;border:1px solid var(--line-strong);border-radius:3px;font-size:12.5px;background:var(--white);}
  .over{color:var(--red);font-weight:600;}
</style>
</head>
<body>

<div class="frame" id="frame">
  <header class="topbar" id="topbar"></header>
  <div class="body">
    <aside class="menu" id="menu" aria-label="Menu do módulo"></aside>
    <main id="main"></main>
  </div>
  <footer class="statusbar" id="statusbar"></footer>
</div>
<div class="scrim" id="scrim" hidden></div>

<div id="toasts" aria-live="polite"></div>
<div id="painel" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="painel-title" id="painel-box"></div></div>
<div id="modal" hidden><div class="box" role="dialog" aria-modal="true"><h4 id="modal-title"></h4><p id="modal-msg"></p><div class="actions"><button class="ghost" id="modal-no">Cancelar</button><button class="primary" id="modal-yes">Confirmar</button></div></div></div>

<script>
/* =====================================================================
   PRUMO — controle de obra (dados no servidor)
   ===================================================================== */

/* ---------------------- Utilitários ---------------------- */
const fmtMoney = v => (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtPct = v => (isFinite(v)?v:0).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
const fmtNum = v => (v||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
const fmtDate = d => { if(!d) return '—'; const dt = new Date(d+'T00:00:00'); return isNaN(dt) ? String(d) : dt.toLocaleDateString('pt-BR'); };
/* Data local (não UTC): evita virar o dia às 21h no horário de Brasília */
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
const tbl = html => `<div class="tbl">${html}</div>`;

/* ---------------------- Glossário ---------------------- */
const GLOSSARIO = {
  orcamento:['Orçamento','Quanto você planejou gastar na obra, serviço por serviço. É a régua contra a qual todo gasto é comparado.'],
  etapa:['Etapa','Uma grande fase da obra: Fundação, Estrutura, Instalações, Acabamento.'],
  servico:['Serviço','Um trabalho dentro da etapa. Ex.: "Alvenaria estrutural" dentro de Estrutura. Cada gasto da obra é ligado a um serviço.'],
  insumo:['Insumo','O que o serviço consome para ser feito: material, mão de obra, equipamento ou empreitada. Cada insumo tem um código único e um preço de referência, cadastrados em Cadastros.'],
  composicao:['Composição de serviço','A "receita" de um serviço: quanto de cada insumo é preciso para fazer 1 unidade dele. Ex.: 1 m² de alvenaria = 13,5 blocos + 0,1 saco de cimento + 0,85 h de pedreiro... O preço do serviço sai da soma dos insumos.'],
  coeficiente:['Coeficiente','Quanto do insumo vai em 1 unidade do serviço. Se o coeficiente do bloco é 13,5 e o serviço tem 100 m², a obra vai precisar de 1.350 blocos.'],
  verba:['Serviço por verba','Serviço com valor fechado, sem composição (ex.: taxa de alvará, projeto, empreitada global). Entra no orçamento só com o valor, sem lista de insumos.'],
  basegeral:['Base geral','Insumos e composições que valem para todas as obras. Só o administrador altera. Cada obra também pode ter os seus próprios, que só ela enxerga.'],
  planejado:['Planejado (orçado)','Quantidade × preço unitário. É o valor que você espera gastar naquele serviço.'],
  realizado:['Realizado','Quanto já foi gasto de verdade naquele serviço: material retirado do estoque + medições aprovadas de empreiteiros + pagamentos avulsos ligados a ele.'],
  fisico:['Avanço físico','Quanto da obra já está pronto, em %. Quem acompanha a obra (engenheiro ou mestre) informa por etapa.'],
  financeiro:['Avanço financeiro','Quanto do orçamento já foi gasto, em %. Se ele corre muito à frente do avanço físico, a obra está gastando mais do que deveria para o que entregou.'],
  nf:['Nota fiscal de entrada','O registro de uma compra que chegou na obra (ou outro documento que será pago: recibo, fatura). Ao lançar, o material entra no estoque e o sistema cria a conta a pagar ao fornecedor. É a única forma de o saldo subir.'],
  estoque:['Estoque (saldo)','O material que está guardado na obra e ainda não foi usado. Material em estoque ainda não conta como gasto de nenhum serviço.'],
  baixa:['Baixa de estoque','A saída de material do estoque: para um serviço (vira gasto dele) ou por perda, quebra, ajuste de inventário ou devolução (não entra no gasto de nenhum serviço). É também como se corrige um saldo que ficou maior que o real.'],
  customedio:['Custo médio','O preço médio que você pagou por um material, considerando todas as compras. Ex.: 100 sacos a R$ 30 + 100 a R$ 34 = custo médio de R$ 32.'],
  consumo:['Consumo','Baixa de material do estoque para um serviço. É nesse momento que o material vira gasto (realizado) daquele serviço. A nota fiscal só diz para qual serviço o material foi comprado.'],
  empreiteiro:['Empreiteiro','A equipe terceirizada que executa um serviço (pedreiro, eletricista, pintor...).'],
  contrato:['Contrato','O acordo de valor com um empreiteiro para um serviço do orçamento.'],
  medicao:['Medição','A conferência de quanto o empreiteiro executou num período, em % do contrato. É a base para pagar: mediu 40%, paga 40% do valor.'],
  aprovar:['Aprovar medição','Confirmar que o que o empreiteiro diz ter feito foi mesmo feito. Só depois de aprovada a medição vira gasto e gera pagamento.'],
  programado:['Programado','Pagamento previsto, que ainda não saiu do caixa.'],
  pago:['Pago','Pagamento que já foi feito. Você marca manualmente quando o dinheiro sai.'],
  vencido:['Vencido','Pagamento programado cuja data já passou e ainda não foi marcado como pago.'],
};
function t(key, label){ return `<button type="button" class="term" data-term="${key}">${esc(label || GLOSSARIO[key][0])}</button>`; }

/* ---------------------- Estado ---------------------- */
const STORAGE_KEY = 'prumo-v1';
let state;

function estadoVazio(){
  return {
    obra:{nome:'Minha obra', cliente:'', prazo:'', valorContratado:0},
    orcamento:[], etapaAvanco:{}, fornecedores:[], materiais:[], notasFiscais:[], pedidos:[],
    empreiteiros:[], contratos:[], medicoes:[], pagamentos:[],
    seq: 1000,
    nextIds:{nf:1, pedido:1, contrato:1, medicao:1, pagamento:1},
  };
}
function uid(){ return ++state.seq; }

function estadoExemplo(){
  state = estadoVazio();
  state.obra = {nome:'Residencial Bela Vista', cliente:'Construtora Horizonte Ltda.', prazo:'2027-03-15', valorContratado:315000};
  state.orcamento = [
    {id:1, etapa:'Fundação', servico:'Escavação e sapatas', insumo:'Cimento, escavação e mão de obra', unidade:'m³', qtd:120, precoUnit:180},
    {id:2, etapa:'Fundação', servico:'Concreto estrutural', insumo:'Concreto usinado FCK 25 + aço', unidade:'m³', qtd:60, precoUnit:620},
    {id:3, etapa:'Estrutura', servico:'Alvenaria estrutural', insumo:'Bloco estrutural 14x19x39', unidade:'m²', qtd:480, precoUnit:145},
    {id:4, etapa:'Estrutura', servico:'Laje pré-moldada', insumo:'Vigota e lajota pré-moldada', unidade:'m²', qtd:210, precoUnit:210},
    {id:5, etapa:'Instalações', servico:'Instalação elétrica', insumo:'Cabos e conduítes elétricos', unidade:'ponto', qtd:150, precoUnit:95},
    {id:6, etapa:'Instalações', servico:'Instalação hidráulica', insumo:'Tubos e conexões PVC', unidade:'ponto', qtd:90, precoUnit:110},
    {id:7, etapa:'Acabamento', servico:'Revestimento cerâmico', insumo:'Porcelanato 60x60', unidade:'m²', qtd:340, precoUnit:78},
    {id:8, etapa:'Acabamento', servico:'Pintura interna/externa', insumo:'Tinta acrílica', unidade:'m²', qtd:520, precoUnit:34},
  ];
  state.etapaAvanco = {'Fundação':100,'Estrutura':65,'Instalações':30,'Acabamento':5};
  state.fornecedores = [
    {id:1, nome:'Cimento Forte Materiais', contato:'(79) 3211-4400'},
    {id:2, nome:'Ferragens União', contato:'(79) 3211-8899'},
    {id:3, nome:'Cerâmica Costa do Sol', contato:'(79) 3025-1122'},
  ];
  state.materiais = [

/* ---------------------- Comunicação com o servidor ---------------------- */
function csrf(){ const m = document.cookie.match(/(?:^|; )csrftoken=([^;]+)/); return m ? decodeURIComponent(m[1]) : ''; }
let ocupado = false;
async function api(metodo, url, corpo){
  if(ocupado) return null;
  ocupado = true; document.body.classList.add('busy');
  try{
    const r = await fetch(url, {method: metodo, credentials: 'same-origin', headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrf()}, body: corpo ? JSON.stringify(corpo) : undefined});
    if(r.status === 401){ location.href = '/conta/login/?next=/'; return null; }
    let j = null; try{ j = await r.json(); }catch(e){}
    if(!r.ok || !j){
      toast('err', r.status === 400 ? 'Não foi possível salvar' : 'Erro no servidor', `<div>${esc(j && j.erro || (r.status === 403 ? 'Sua sessão mudou. Recarregue a página.' : 'Tente de novo em instantes.'))}</div>`);
      return null;
    }
    state = j.estado; renderAll();
    return j;
  }catch(e){
    toast('err', 'Sem conexão', '<div>Não foi possível falar com o servidor. Confira a internet e tente de novo.</div>');
    return null;
  }finally{ ocupado = false; document.body.classList.remove('busy'); }
}

/* ---------------------- Regras de negócio ---------------------- */
function lancarNF({fornecedorId, numero, data, itens}){
  const nf = {id: state.nextIds.nf++, fornecedorId, numero, data, itens: itens.map(it=>({...it}))};
  let total = 0;
  itens.forEach(it=>{
    const mat = state.materiais.find(m=>m.id===it.materialId);
    if(!mat) return;
    const entrada = it.qtd*it.valorUnit;
    const novoSaldo = mat.saldo + it.qtd;
    mat.custoMedio = novoSaldo>0 ? (mat.saldo*mat.custoMedio + entrada)/novoSaldo : it.valorUnit;
    mat.saldo = novoSaldo;
    total += entrada;
  });
  state.notasFiscais.push(nf);
  criarPagamento({tipo:'material', origem:/^nf/i.test(numero) ? numero : 'NF '+numero, orcamentoItemId:null, valor: total, dataProgramada: data});
  return {nf, total};
}

function registrarConsumo({orcamentoItemId, materialId, qtd, data}){
  const mat = state.materiais.find(m=>m.id===materialId);
  if(!mat || mat.saldo<=0) return null;
  const qtdConsumida = Math.min(qtd, mat.saldo);
  const valor = qtdConsumida*mat.custoMedio;
  mat.saldo -= qtdConsumida;
  const pedido = {id: state.nextIds.pedido++, orcamentoItemId, materialId, qtd: qtdConsumida, qtdSolicitada:qtd, valor, data};
  state.pedidos.push(pedido);
  return pedido;
}

function criarContrato({empreiteiroId, orcamentoItemId, valorContratado, formaPagamento}){
  const contrato = {id: state.nextIds.contrato++, empreiteiroId, orcamentoItemId, valorContratado, formaPagamento};
  state.contratos.push(contrato);
  return contrato;
}

/* % já medido (pendente + aprovado) num contrato */
function pctMedido(contratoId, apenasAprovadas){
  return state.medicoes.filter(m=>m.contratoId===contratoId && (!apenasAprovadas || m.status==='aprovada')).reduce((s,m)=>s+m.percentual,0);
}

function registrarMedicao({contratoId, data, percentual}){
  const contrato = state.contratos.find(c=>c.id===contratoId);
  const valor = contrato ? contrato.valorContratado*(percentual/100) : 0;
  const medicao = {id: state.nextIds.medicao++, contratoId, data, percentual, valor, status:'pendente'};
  state.medicoes.push(medicao);
  return medicao;
}

function aprovarMedicao(medicaoId){
  const med = state.medicoes.find(m=>m.id===medicaoId);
  if(!med || med.status==='aprovada') return null;
  med.status = 'aprovada';
  const contrato = state.contratos.find(c=>c.id===med.contratoId);
  return criarPagamento({tipo:'mao-de-obra', origem:'Medição #'+med.id, orcamentoItemId: contrato ? contrato.orcamentoItemId : null, valor: med.valor, dataProgramada: med.data, medicaoId: med.id});
}

function criarPagamento({tipo, origem, orcamentoItemId, valor, dataProgramada, medicaoId}){
  const pag = {id: state.nextIds.pagamento++, tipo, origem, orcamentoItemId, valor, dataProgramada, dataPagamento:null, status:'programado', medicaoId: medicaoId||null};
  state.pagamentos.push(pag);
  return pag;
}

function marcarPago(id){ const p = state.pagamentos.find(x=>x.id===id); if(p){ p.status='pago'; p.dataPagamento = todayStr(); } }
const vencido = p => p.status==='programado' && p.dataProgramada < todayStr();

/* De onde vem o "realizado" de um serviço — cada valor rastreável até a origem */
function origensDoItem(itemId){
  const out = [];
  state.pedidos.filter(p=>p.orcamentoItemId===itemId).forEach(p=>{
    const mat = state.materiais.find(m=>m.id===p.materialId);
    out.push({data:p.data, tipo:'Consumo de material', desc:`${fmtNum(p.qtd)} ${mat?esc(mat.unidade):''} de ${mat?esc(mat.nome):'material'} (custo médio)`, valor:p.valor});
  });
  const contratos = state.contratos.filter(c=>c.orcamentoItemId===itemId);
  state.medicoes.filter(m=>m.status==='aprovada' && contratos.some(c=>c.id===m.contratoId)).forEach(m=>{
    const c = contratos.find(c=>c.id===m.contratoId);
    const emp = state.empreiteiros.find(e=>e.id===c.empreiteiroId);
    out.push({data:m.data, tipo:'Medição aprovada', desc:`#${m.id} · ${emp?esc(emp.nome):'—'} · ${fmtPct(m.percentual)} do contrato`, valor:m.valor});
  });
  state.pagamentos.filter(p=>p.tipo==='avulso' && p.orcamentoItemId===itemId).forEach(p=>{
    out.push({data:p.dataProgramada, tipo:'Pagamento avulso', desc:esc(p.origem), valor:p.valor});
  });
  return out.sort((a,b)=>String(a.data).localeCompare(String(b.data)));
}
function realizadoDoItem(itemId){ return origensDoItem(itemId).reduce((s,o)=>s+o.valor,0); }
function planejadoDoItem(item){ return item.qtd*item.precoUnit; }
function statusClasse(pct){ if(pct>=100) return 'danger'; if(pct>=75) return 'warn'; return 'ok'; }
function itemTemVinculo(id){
  return state.pedidos.some(p=>p.orcamentoItemId===id) || state.notasFiscais.some(n=>n.itens.some(it=>it.orcamentoItemId===id)) || state.contratos.some(c=>c.orcamentoItemId===id) || state.pagamentos.some(p=>p.orcamentoItemId===id);
}

/* ---------------------- Avisos e confirmação (substituem alert/confirm) ---------------------- */
function toast(kind, title, body, ms){
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast '+kind;
  el.innerHTML = `<div class="t-body"><b>${esc(title)}</b>${body||''}</div><button aria-label="Fechar">×</button>`;
  el.querySelector('button').onclick = ()=>el.remove();
  box.appendChild(el);
  while(box.children.length>3) box.firstChild.remove();
  setTimeout(()=>el.remove(), ms || (kind==='err' ? 7000 : 9000));
}
const erro = (msg) => toast('err', 'Falta informação', esc(msg));

function confirmar(title, msg, yesLabel, onYes, danger){
  const m = document.getElementById('modal');
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-msg').textContent = msg;
  const yes = document.getElementById('modal-yes');
  yes.textContent = yesLabel || 'Confirmar';
  yes.className = danger ? 'danger-btn' : 'primary';
  const fechar = ()=>{ m.hidden = true; };
  yes.onclick = ()=>{ fechar(); onYes(); };
  document.getElementById('modal-no').onclick = fechar;
  m.onclick = e=>{ if(e.target===m) fechar(); };
  m.hidden = false;
  yes.focus();
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') document.getElementById('modal').hidden = true; });
document.addEventListener('click', e=>{
  const b = e.target.closest('button.term');

});

      const rec = (prefs().recentes||[]).map(r=>funcaoDe(r.tab, r.anchor)).filter(Boolean);

      itens = fn.concat(gl);
      res.innerHTML = itens.length ? itens.map((x,i)=> x.f
        ? `<button class="dd-item ${i===sel?'sel':''}" data-i="${i}"><b>${esc(x.f.label)}</b><small>${esc(x.f.path)}</small></button>`
        : `<button class="dd-item ${i===sel?'sel':''}" data-i="${i}"><b>${esc(x.v[0])}</b><small>Glossário · o que significa</small></button>`).join('')
        : `<div class="dd-empty">Nada encontrado para "${esc(q)}". Tente "nota", "medição" ou "pagamento".</div>`;
    }
    res.hidden = false;
  };
  const escolher = i=>{
    const x = itens[i]; if(!x) return;

  };
  inp.addEventListener('focus', ()=>{ sel = 0; desenhar(); });
  inp.addEventListener('input', ()=>{ sel = 0; desenhar(); });

    menuU.hidden = false;

/* ---------------------- Resumo da obra (usado no mural) ---------------------- */
function resumoObra(){
  const totalPlanejado = state.orcamento.reduce((s,i)=>s+planejadoDoItem(i),0);
  const totalRealizado = state.orcamento.reduce((s,i)=>s+realizadoDoItem(i.id),0);
  const pctGeral = totalPlanejado>0 ? totalRealizado/totalPlanejado*100 : 0;
  const etapas = [...new Set(state.orcamento.map(i=>i.etapa))];
  const avancoFisico = totalPlanejado>0 ? etapas.reduce((s,et)=>s + state.orcamento.filter(i=>i.etapa===et).reduce((s2,i)=>s2+planejadoDoItem(i),0)*(state.etapaAvanco[et]||0),0)/totalPlanejado : 0;
  const dias = state.obra.prazo ? Math.ceil((new Date(state.obra.prazo+'T00:00:00') - new Date(new Date().toDateString()))/86400000) : null;
  const gap = pctGeral - avancoFisico;
  const leitura = !totalPlanejado ? '' : gap > 10 ? `O gasto está ${fmtPct(gap)} à frente do que já está pronto. Vale investigar onde está gastando mais do que entregando.`
    : gap < -10 ? `A obra está mais adiantada do que o gasto. Bom sinal, ou há gastos ainda não lançados.` : `Gasto e avanço estão andando juntos. É o cenário esperado.`;
  return {totalPlanejado, totalRealizado, pctGeral, avancoFisico, dias, leitura};
}

function renderDashboard(){
  const totalPlanejado = state.orcamento.reduce((s,i)=>s+planejadoDoItem(i),0);
  const totalRealizado = state.orcamento.reduce((s,i)=>s+realizadoDoItem(i.id),0);
  const pctGeral = totalPlanejado>0 ? totalRealizado/totalPlanejado*100 : 0;
  const valorEstoque = state.materiais.reduce((s,m)=>s+m.saldo*m.custoMedio,0);
  const programados = state.pagamentos.filter(p=>p.status==='programado');
  const vencidos = programados.filter(vencido);
  const proximos = programados.slice().sort((a,b)=>a.dataProgramada.localeCompare(b.dataProgramada)).slice(0,5);
  const alertas = state.orcamento.map(i=>({item:i, pct: planejadoDoItem(i)>0 ? realizadoDoItem(i.id)/planejadoDoItem(i)*100 : 0})).filter(x=>x.pct>=75).sort((a,b)=>b.pct-a.pct);
  const medPend = state.medicoes.filter(m=>m.status==='pendente');
  const etapas = [...new Set(state.orcamento.map(i=>i.etapa))];
  const avancoFisico = totalPlanejado>0 ? etapas.reduce((s,et)=>{
      const plan = state.orcamento.filter(i=>i.etapa===et).reduce((s2,i)=>s2+planejadoDoItem(i),0);
      return s + plan*(state.etapaAvanco[et]||0);
    },0)/totalPlanejado : 0;
  const temPrazo = !!state.obra.prazo;
  const dias = temPrazo ? Math.ceil((new Date(state.obra.prazo+'T00:00:00') - new Date(new Date().toDateString()))/86400000) : null;
  const gap = pctGeral - avancoFisico;
  let leitura = '';
  if(totalPlanejado>0){
    if(gap > 10) leitura = `O gasto (${fmtPct(pctGeral)}) está ${fmtPct(gap)} à frente do que já está pronto (${fmtPct(avancoFisico)}). Vale investigar onde está gastando mais do que entregando.`;
    else if(gap < -10) leitura = `A obra está mais adiantada (${fmtPct(avancoFisico)}) do que o gasto (${fmtPct(pctGeral)}). Bom sinal, ou há gastos ainda não lançados.`;
    else leitura = `Gasto e avanço estão andando juntos. É o cenário esperado.`;
  }

  const pendencias = [];
  vencidos.forEach(p=> pendencias.push(`<div class="alert-row danger"><span>Pagamento vencido: ${esc(p.origem)} · ${fmtMoney(p.valor)}</span><button class="ghost" onclick="irPara('financeiro')">Ver</button></div>`));
  medPend.forEach(m=>{
    const c = state.contratos.find(c=>c.id===m.contratoId); const emp = c ? state.empreiteiros.find(e=>e.id===c.empreiteiroId) : null;
    pendencias.push(`<div class="alert-row warn"><span>Medição a aprovar: ${emp?esc(emp.nome):'—'} · ${fmtPct(m.percentual)}</span><button class="ghost" onclick="irPara('contratos')">Ver</button></div>`);
  });

  return `
    <h2 class="section-title">Painel da Obra</h2>
    <p class="section-sub">Visão consolidada · ${esc(state.obra.nome)}</p>
    ${intro('dashboard','Para que serve esta tela', `<p>É o resumo da obra em uma tela. Você não lança nada aqui: tudo é calculado a partir do que foi lançado nas outras abas.</p><p>Compare as duas réguas do topo. A da esquerda é o ${t('fisico')} (quanto está pronto). A da direita é o ${t('financeiro')} (quanto do orçamento já foi gasto). O ideal é que andem juntas.</p>`)}

    ${state.orcamento.length===0 ? `<div class="empty" style="margin-bottom:18px;">Sua obra ainda não tem orçamento. Comece cadastrando os serviços no Orçamento ou importando uma planilha em Dados da obra e planilhas.<br><br><button class="primary" onclick="irPara('orcamento','form-orc')">Cadastrar orçamento</button></div>` : ''}

    <div class="hero">
      <div class="hero-top">
        <h3>Avanço geral da obra</h3>
        <span class="mono">${!temPrazo ? 'Informe o prazo em Dados da obra' : dias>=0 ? dias+' dias até o prazo de entrega' : Math.abs(dias)+' dias além do prazo de entrega'}</span>
      </div>
      <div class="hero-grid">
        <div>
          <div class="hero-figure">${fmtPct(avancoFisico)}</div>
          ${rulerBar(100, avancoFisico, 'Quanto está pronto (físico)', '')}
        </div>
        <div>
          <div class="hero-figure">${fmtPct(pctGeral)}</div>
          ${rulerBar(totalPlanejado, totalRealizado, 'Quanto do orçamento foi gasto (financeiro)', '')}
        </div>
      </div>
      ${leitura ? `<div class="hero-note">${leitura}</div>` : ''}
    </div>

    <div class="grid grid-4">
      <div class="card metric-card">
        <div class="metric-label">${t('planejado','Orçado total')}</div>
        <div class="metric-value small">${fmtMoney(totalPlanejado)}</div>
        <div class="metric-foot">${state.orcamento.length} serviços${state.obra.valorContratado ? ' · contrato '+fmtMoney(state.obra.valorContratado) : ''}</div>
      </div>
      <div class="card metric-card">
        <div class="metric-label">${t('realizado','Gasto até agora')}</div>
        <div class="metric-value small ${statusClasse(pctGeral)}">${fmtMoney(totalRealizado)}</div>
        <div class="metric-foot">${fmtPct(pctGeral)} do orçado</div>
      </div>
      <div class="card metric-card">
        <div class="metric-label">${t('estoque','Parado no estoque')}</div>
        <div class="metric-value small">${fmtMoney(valorEstoque)}</div>
        <div class="metric-foot">${state.materiais.filter(m=>m.saldo>0).length} materiais com saldo</div>
      </div>
      <div class="card metric-card">
        <div class="metric-label">${t('programado','A pagar')}</div>
        <div class="metric-value small ${vencidos.length?'danger':''}">${fmtMoney(programados.reduce((s,p)=>s+p.valor,0))}</div>
        <div class="metric-foot">${programados.length} pagamentos${vencidos.length? ' · '+vencidos.length+' vencido'+(vencidos.length>1?'s':''):''}</div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="grid grid-2">
      <div class="card">
        <h3>Pronto × gasto, por etapa</h3>
        ${etapas.length ? etapas.map(et=>{
          const itens = state.orcamento.filter(i=>i.etapa===et);
          const plan = itens.reduce((s,i)=>s+planejadoDoItem(i),0);
          const real = itens.reduce((s,i)=>s+realizadoDoItem(i.id),0);
          const fisico = state.etapaAvanco[et]||0;
          return `<div style="margin-bottom:16px;">
              <div style="font-weight:600;font-size:13.5px;margin-bottom:4px;">${esc(et)}</div>
              ${rulerBar(100, fisico, 'Pronto', '')}
              ${rulerBar(plan, real, 'Gasto', fmtMoney(real)+' de '+fmtMoney(plan))}
            </div>`;
        }).join('') : '<div class="empty">Sem etapas cadastradas.</div>'}
      </div>

      <div class="card">
        <h3>O que precisa de atenção</h3>
        ${pendencias.length ? pendencias.join('') : '<div class="empty">Nenhum pagamento vencido nem medição esperando aprovação.</div>'}
        <div class="divider"></div>
        <h3>Serviços perto de estourar</h3>
        ${alertas.length ? alertas.map(a=>`<div class="alert-row ${a.pct>=100?'danger':'warn'}"><span>${esc(a.item.servico)}</span><span class="mono">${fmtPct(a.pct)}</span></div>`).join('') : '<div class="empty">Nenhum serviço passou de 75% do orçado.</div>'}
        <div class="divider"></div>
        <h3>Próximos pagamentos</h3>
        ${proximos.length ? tbl(`<table><thead><tr><th>Data</th><th>Origem</th><th class="num">Valor</th></tr></thead><tbody>
          ${proximos.map(p=>`<tr><td class="mono">${fmtDate(p.dataProgramada)} ${vencido(p)?pill('vencido','danger'):''}</td><td>${esc(p.origem)}</td><td class="num">${fmtMoney(p.valor)}</td></tr>`).join('')}
        </tbody></table>`) : '<div class="empty">Nenhum pagamento programado.</div>'}
      </div>
    </div>

  `;
}

const fmtCoef = v => (v||0).toLocaleString('pt-BR',{maximumFractionDigits:8});

function filtrarLinhas(tbodyId, termo, extra){
  const ts = norm(termo).split(/\s+/).filter(Boolean);
  document.querySelectorAll('#'+tbodyId+' tr[data-busca]').forEach(tr=>{
    const ok = ts.every(t=>tr.dataset.busca.includes(t)) && (!extra || extra(tr));
    tr.hidden = !ok;
    const det = tr.nextElementSibling; if(det && det.classList.contains('origem-row')) det.hidden = !ok;
  });
}
/* Quantidade de um insumo já usada (consumo do estoque) num serviço */
function usadoDoInsumo(itemId, insumoId){
  const mats = new Set(state.materiais.filter(m=>m.insumoId===insumoId).map(m=>m.id));
  return state.pedidos.filter(p=>p.orcamentoItemId===itemId && mats.has(p.materialId)).reduce((s,p)=>s+p.qtd,0);
}

function abrirInsumo(id){
  const x = id ? insumoPor(id) : {codigo:'', descricao:'', unidade:'', tipo:'material', preco:0, base:false};
  if(!x) return;
  const so = id && !podeEditar(x);
  const dis = so ? 'disabled' : '';
  const sinapi = x.fonte==='sinapi', precoLivre = sinapi && x.semPreco;
  abrirPainel(id ? (sinapi ? 'Insumo do SINAPI' : so ? 'Insumo da base geral' : 'Editar insumo') : 'Novo insumo', `
    ${sinapi ? `<p class="formhint">Este insumo vem do SINAPI (${esc(x.origem||'')}) e não pode ser editado, para manter a rastreabilidade.${x.origemPreco==='sp'?' <b>O preço é de São Paulo</b>: o SINAPI não coletou preço na sua UF neste mês.':''}${precoLivre?' <b>O SINAPI não tem preço para ele:</b> informe o preço que você pratica.':''}</p>` : ''}
    ${so && !sinapi ? `<p class="formhint">Este insumo é da ${t('basegeral','base geral')}: só o administrador altera. Se o preço for diferente na sua obra, cadastre um insumo próprio.</p>` : ''}
    <div class="formgrid">
      <div><label for="p-ins-cod">Código</label><input id="p-ins-cod" value="${esc(x.codigo)}" placeholder="automático" ${dis}></div>
      <div style="grid-column:span 2;"><label for="p-ins-desc">Descrição</label><input id="p-ins-desc" value="${esc(x.descricao)}" placeholder="Ex: Cimento CP-II 50 kg" ${dis}></div>
      <div><label for="p-ins-un">Unidade</label><input id="p-ins-un" value="${esc(x.unidade)}" placeholder="sc, kg, m², h, un..." ${dis}></div>
      <div><label for="p-ins-tipo">Tipo</label><select id="p-ins-tipo" ${dis}>${(state.tiposInsumo||[]).map(tp=>`<option value="${tp.id}" ${tp.id===x.tipo?'selected':''}>${esc(tp.nome)}</option>`).join('')}</select></div>
      <div><label for="p-ins-preco">Preço de referência (R$)</label><input id="p-ins-preco" type="number" step="0.01" min="0" inputmode="decimal" value="${x.preco||''}" ${so && !precoLivre ? 'disabled' : ''}></div>
      ${!id && state.podeEditarBase ? `<div><label for="p-ins-esc">Onde vale</label><select id="p-ins-esc"><option value="obra">Só nesta obra</option><option value="base">Base geral (todas as obras)</option></select></div>` : ''}
    </div>
    ${!id ? '<p class="formhint">Deixe o código em branco para o sistema numerar sozinho. O código não pode se repetir.</p>' : ''}`,
    so && !precoLivre ? `<button class="ghost" onclick="fecharPainel()">Fechar</button>` : `<button class="ghost" onclick="fecharPainel()">Cancelar</button><button class="primary" onclick="salvarInsumo(${id||0})">${precoLivre?'Salvar preço':'Salvar insumo'}</button>`);
}
async function salvarInsumo(id){
  const d = {codigo:val('p-ins-cod').trim(), descricao:val('p-ins-desc').trim(), unidade:val('p-ins-un').trim(), tipo:val('p-ins-tipo'), preco:val('p-ins-preco')||0, escopo:val('p-ins-esc')||'obra'};
  if(id && (insumoPor(id)||{}).fonte==='sinapi'){ const r = await api('POST', `/api/insumos/${id}`, {preco:d.preco}); if(r){ fecharPainel(); toast('ok','Preço salvo',''); } return; }
  if(!d.descricao || !d.unidade){ erro('Informe a descrição e a unidade.'); return; }
  const r = await api('POST', id ? `/api/insumos/${id}` : '/api/insumos', d);
  if(r){ fecharPainel(); toast('ok', id ? 'Insumo atualizado' : 'Insumo cadastrado', id ? '<div>Serviços que já estão no orçamento mantêm o preço da data em que entraram. Use "atualizar pela composição" no serviço se quiser o preço novo.</div>' : ''); }
}
function excluirInsumo(id){
  const x = insumoPor(id); if(!x) return;
  confirmar('Excluir insumo?', `${x.codigo} · ${x.descricao} sai do cadastro. Só é possível se ele não estiver em nenhuma composição, orçamento ou estoque.`, 'Excluir', async ()=>{
    if(await api('DELETE', `/api/insumos/${id}`)) toast('ok','Insumo excluído','');
  }, true);
}

/* ---- composição ---- */
function opcoesInsumos(sel, soBase){
  const lista = (state.insumos||[]).filter(i=>!soBase || i.base);
  return '<option value="">Escolha o insumo…</option>' + (state.tiposInsumo||[]).map(tp=>{
    const grupo = lista.filter(i=>i.tipo===tp.id);
    return grupo.length ? `<optgroup label="${esc(tp.nome)}">${grupo.map(i=>`<option value="${i.id}" ${i.id===sel?'selected':''}>${esc(i.codigo+' · '+i.descricao+' ('+i.unidade+')')}</option>`).join('')}</optgroup>` : '';
  }).join('');
}
function abrirComposicao(id){
  const c = id ? compPor(id) : null;
  if(id && !c) return;
  ed = {tipo:'comp', id:id||0, so: !!(c && !podeEditar(c)), base: c ? c.base : false,
        codigo: c?c.codigo:'', descricao: c?c.descricao:'', unidade: c?c.unidade:'', observacao: c?c.observacao:'',
        sinapi: !!(c && c.fonte==='sinapi'), origem: c ? c.origem : '',
        itens: c ? c.itens.map(i=>({insumoId:i.insumoId, coef:i.coef})) : [{insumoId:null, coef:''}]};
  desenharComposicao();
}
function desenharComposicao(){
  const so = ed.so, dis = so ? 'disabled' : '';
  const titulo = ed.id ? (ed.sinapi ? 'Composição do SINAPI' : so ? 'Composição da base geral' : 'Editar composição') : 'Nova composição de serviço';
  abrirPainel(titulo, `
    ${ed.sinapi ? `<p class="formhint">Esta composição vem do SINAPI (${esc(ed.origem)}) e não pode ser editada, para manter a rastreabilidade. Para ajustar coeficientes, use <b>Duplicar para esta obra</b>: a cópia é sua e o original continua intacto.</p>` : so ? `<p class="formhint">Esta composição é da ${t('basegeral','base geral')}. Para ajustar coeficientes só na sua obra, use <b>Duplicar para esta obra</b>.</p>` : `<p class="formhint">Diga quanto de cada insumo vai em <b>1 unidade</b> do serviço (o ${t('coeficiente','coeficiente')}). O custo do serviço é calculado sozinho com os preços dos insumos.</p>`}
    <div class="formgrid">
      <div><label for="p-c-cod">Código</label><input id="p-c-cod" value="${esc(ed.codigo)}" placeholder="automático" oninput="ed.codigo=this.value" ${dis}></div>
      <div style="grid-column:span 2;"><label for="p-c-desc">Serviço (descrição)</label><input id="p-c-desc" value="${esc(ed.descricao)}" placeholder="Ex: Alvenaria de vedação com bloco cerâmico" oninput="ed.descricao=this.value" ${dis}></div>
      <div><label for="p-c-un">Unidade do serviço</label><input id="p-c-un" value="${esc(ed.unidade)}" placeholder="m², m³, m, ponto..." oninput="ed.unidade=this.value;atualizarTotalComp()" ${dis}></div>
      ${!ed.id && state.podeEditarBase ? `<div><label for="p-c-esc">Onde vale</label><select id="p-c-esc" onchange="ed.escopo=this.value;desenharComposicao()"><option value="obra" ${ed.escopo!=='base'?'selected':''}>Só nesta obra</option><option value="base" ${ed.escopo==='base'?'selected':''}>Base geral (todas as obras)</option></select></div>` : ''}
    </div>
    <div class="comp-head"><span>Insumo</span><span>Coeficiente</span><span class="sub">Custo</span><span></span></div>
    <div class="comp-rows">${ed.itens.map((it,idx)=>`<div class="comp-row">
        <select aria-label="Insumo ${idx+1}" onchange="ed.itens[${idx}].insumoId=parseInt(this.value)||null;atualizarTotalComp()" ${dis}>${opcoesInsumos(it.insumoId, ed.base || ed.escopo==='base')}</select>
        <input aria-label="Coeficiente ${idx+1}" type="number" step="0.0001" min="0" inputmode="decimal" value="${it.coef}" oninput="ed.itens[${idx}].coef=this.value;atualizarTotalComp()" ${dis}>
        <span class="sub" id="p-c-sub-${idx}"></span>
        ${so ? '<span></span>' : `<button type="button" aria-label="Remover linha" onclick="ed.itens.splice(${idx},1);desenharComposicao()">×</button>`}
      </div>`).join('')}
      ${so ? '' : `<button class="ghost" type="button" onclick="ed.itens.push({insumoId:null,coef:''});desenharComposicao()">+ insumo</button>
        <button class="link" type="button" style="margin-left:10px;" onclick="fecharPainel();irPara('cadastros','sec-ins');abrirInsumo()">o insumo não está na lista? cadastrar</button>`}
    </div>
    <div class="preview" style="margin-top:14px;"><div class="tot" id="p-c-total"></div></div>
    <div class="formgrid"><div style="grid-column:1/-1;"><label for="p-c-obs">Observação</label><input id="p-c-obs" value="${esc(ed.observacao)}" oninput="ed.observacao=this.value" ${dis}></div></div>`,
    so ? `<button class="ghost" onclick="fecharPainel()">Fechar</button><button class="primary" onclick="duplicarComposicao(${ed.id})">Duplicar para esta obra</button>`
       : `<button class="ghost" onclick="fecharPainel()">Cancelar</button><button class="primary" onclick="salvarComposicao()">Salvar composição</button>`);
  atualizarTotalComp();
}
function atualizarTotalComp(){
  if(!ed || ed.tipo!=='comp') return;
  let total = 0;
  ed.itens.forEach((it,idx)=>{
    const ins = insumoPor(it.insumoId), sub = ins ? ins.preco*num(it.coef) : 0;
    total += sub;
    const el = document.getElementById('p-c-sub-'+idx);
    if(el) el.textContent = ins ? fmtMoney(sub) : '';
  });
  const el = document.getElementById('p-c-total');
  if(el) el.innerHTML = `<span>Custo de 1 ${esc(ed.unidade||'unidade')}: <b>${fmtMoney(total)}</b></span><span>${ed.itens.filter(i=>i.insumoId).length} insumo(s)</span>`;
}
async function salvarComposicao(){
  const itens = ed.itens.filter(i=>i.insumoId || String(i.coef).trim()).map(i=>({insumoId:i.insumoId, coef:i.coef}));
  if(!ed.descricao.trim() || !ed.unidade.trim()){ erro('Informe a descrição e a unidade do serviço.'); return; }
  if(!itens.length){ erro('Adicione pelo menos um insumo.'); return; }
  if(itens.some(i=>!i.insumoId || !(num(i.coef)>0))){ erro('Cada linha precisa de um insumo e de um coeficiente maior que zero.'); return; }
  const novo = !ed.id;
  const r = await api('POST', novo ? '/api/composicoes' : `/api/composicoes/${ed.id}`, {codigo:ed.codigo.trim(), descricao:ed.descricao.trim(), unidade:ed.unidade.trim(), observacao:ed.observacao, escopo:ed.escopo||'obra', itens});
  if(r){ fecharPainel(); toast('ok', novo ? 'Composição cadastrada' : 'Composição atualizada', novo ? '<div>Ela já aparece para escolher ao adicionar um serviço no Orçamento.</div>' : '<div>Serviços que já estão no orçamento não mudam sozinhos. Use "atualizar pela composição" no serviço.</div>'); }
}
async function duplicarComposicao(id){
  const r = await api('POST', `/api/composicoes/${id}/duplicar`);
  if(r){ const c = compPor(r.id); toast('ok','Composição copiada para esta obra', `<div>${esc(c?c.codigo:'')}: agora você pode ajustar os coeficientes.</div>`); abrirComposicao(r.id); }
}
function excluirComposicao(id){
  const c = compPor(id); if(!c) return;
  confirmar('Excluir composição?', `${c.codigo} · ${c.descricao} sai do cadastro. Serviços que já usam essa composição continuam no orçamento com os insumos que tinham.`, 'Excluir', async ()=>{
    if(await api('DELETE', `/api/composicoes/${id}`)) toast('ok','Composição excluída','');
  }, true);
}

function filtrarInsumos(){
  const tp = val('b-ins-tipo'), es = val('b-ins-esc');
  filtrarLinhas('tb-ins', val('b-ins'), tr=>(!tp || tr.dataset.tipo===tp) && (!es || tr.dataset.esc===es));
}

/* ---- planilhas do cadastro ---- */
function lerPlanilha(evt, aba, cb){
  const file = evt.target.files[0]; evt.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    let linhas;
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      const nome = wb.SheetNames.find(n=>normKey(n)===normKey(aba)) || wb.SheetNames[0];
      linhas = XLSX.utils.sheet_to_json(wb.Sheets[nome], {defval:'', raw:true}).map(linhaNormalizada);
    }catch(err){ toast('err','Não foi possível ler essa planilha','<div>Use o modelo baixado aqui (formato .xlsx).</div>'); return; }
    if(!linhas.length){ toast('err','Planilha vazia','<div>A primeira linha deve ter os nomes das colunas, como no modelo.</div>'); return; }
    cb(linhas);
  };
  reader.readAsArrayBuffer(file);
}
function importarCatalogo(evt, tipo){
  const escopo = val(tipo==='insumos' ? 'imp-ins-esc' : 'imp-comp-esc') || 'obra';
  lerPlanilha(evt, tipo==='insumos' ? 'Insumos' : 'Composicoes', async linhas=>{
    const r = await api('POST', '/api/catalogo/importar', {tipo, escopo, linhas});
    if(!r) return;
    const onde = escopo==='base' ? 'na base geral' : 'nesta obra';
    toast('ok', 'Planilha importada', tipo==='insumos' ? `<div>${r.criados} insumo(s) criado(s) e ${r.atualizados} atualizado(s) ${onde}.</div>` : `<div>${r.criadas} composição(ões) criada(s) e ${r.atualizadas} atualizada(s) ${onde}.</div>`);
  });
}
function baixarModeloInsumos(){
  const ws = XLSX.utils.aoa_to_sheet([['Codigo','Descricao','Unidade','Tipo','Preco'], ['M-001','Telha cerâmica colonial','un','material',2.1], ['M-002','Telhadista','h','mão de obra',30]]);
  ws['!cols'] = [{wch:12},{wch:36},{wch:10},{wch:16},{wch:10}];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Insumos');

function baixarModeloComposicoes(){

    ['S-001','Telhado com telha colonial','m²','M-001',16.5], ['S-001','','','M-002',0.9], ['S-001','','','I-0002',0.6]]);
  ws['!cols'] = [{wch:16},{wch:34},{wch:18},{wch:14},{wch:12}];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Composicoes');
  salvarArquivo(wb, 'modelo-composicoes-prumo.xlsx');
}
function exportarCatalogo(){
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet((state.insumos||[]).map(x=>({Codigo:x.codigo, Descricao:x.descricao, Unidade:x.unidade, Tipo:tipoNome(x.tipo), Preco:x.preco, OndeVale:x.base?'Base geral':'Esta obra'}))), 'Insumos');
  const linhas = [];
  (state.composicoes||[]).forEach(c=>c.itens.forEach((i,k)=>{ const x = insumoPor(i.insumoId);
    linhas.push({CodigoComposicao:c.codigo, DescricaoComposicao:k?'':c.descricao, UnidadeComposicao:k?'':c.unidade, CodigoInsumo:x?x.codigo:'', Coeficiente:i.coef, OndeVale:k?'':(c.base?'Base geral':'Esta obra')}); }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhas), 'Composicoes');
  salvarArquivo(wb, 'cadastro-insumos-composicoes-' + todayStr() + '.xlsx');
}

/* ---------------------- ORÇAMENTO ---------------------- */
const orcDraft = {etapa:'', modo:'comp', compId:null, filtro:''};
function opcoesEtapa(){
  const usadas = new Set(state.etapas.map(e=>norm(e.nome)));
  const padrao = (state.etapasPadrao||[]).filter(n=>!usadas.has(norm(n)));
  const sel = orcDraft.etapa;
  return `<option value="">Escolha a etapa…</option>
    ${state.etapas.length ? `<optgroup label="Etapas desta obra">${state.etapas.map(e=>`<option value="id:${e.id}" ${sel==='id:'+e.id?'selected':''}>${esc(e.nome)}</option>`).join('')}</optgroup>` : ''}
    ${padrao.length ? `<optgroup label="Etapas padrão">${padrao.map(n=>`<option value="nome:${esc(n)}" ${sel==='nome:'+n?'selected':''}>${esc(n)}</option>`).join('')}</optgroup>` : ''}`;
}
function opcoesComposicao(){
  const f = norm(orcDraft.filtro).split(/\s+/).filter(Boolean);
  const ok = c => f.every(t=>norm(c.codigo+' '+c.descricao).includes(t));
  const obra = (state.composicoes||[]).filter(c=>!c.base && ok(c)), base = (state.composicoes||[]).filter(c=>c.base && ok(c));
  const op = c => `<option value="${c.id}" ${orcDraft.compId===c.id?'selected':''}>${esc(c.codigo+' · '+c.descricao+' — '+fmtMoney(c.custo)+'/'+c.unidade)}</option>`;
  if(!obra.length && !base.length) return '<option value="">Nenhuma composição encontrada</option>';
  return '<option value="">Escolha a composição…</option>' + (obra.length ? `<optgroup label="Desta obra">${obra.map(op).join('')}</optgroup>` : '') + (base.length ? `<optgroup label="Base geral">${base.map(op).join('')}</optgroup>` : '');
}
function atualizarPreviewOrc(){
  const el = document.getElementById('orc-preview'); if(!el) return;
  const c = compPor(orcDraft.compId), q = parseFloat(val('f-orc-qtd'))||0;
  if(!c){ el.innerHTML = '<span class="codigo">Escolha uma composição para ver o preço e os insumos previstos.</span>'; return; }
  el.innerHTML = `<div class="tot"><span>Unidade: <b>${esc(c.unidade)}</b></span><span>Custo unitário: <b>${fmtMoney(c.custo)}</b></span><span>Planejado: <b>${fmtMoney(c.custo*q)}</b></span></div>
    ${tbl(`<table class="mini"><thead><tr><th>Insumo previsto</th><th class="num">Coef.</th><th class="num">Quantidade${q?'':' (informe a qtd.)'}</th><th class="num">Custo</th></tr></thead><tbody>
    ${c.itens.map(i=>{ const x = insumoPor(i.insumoId); return `<tr><td><span class="codigo">${x?esc(x.codigo):''}</span> ${x?esc(x.descricao):'—'}</td><td class="num">${fmtCoef(i.coef)}</td><td class="num">${q?fmtNum(i.coef*q)+' '+(x?esc(x.unidade):''):'—'}</td><td class="num">${x&&q?fmtMoney(x.preco*i.coef*q):'—'}</td></tr>`; }).join('')}
    </tbody></table>`)}${c.referencia?'<p class="helptext" style="margin:8px 0 0;">Composição de referência: coeficientes aproximados. Confira antes de fechar o orçamento.</p>':''}`;

function setModoOrc(m){
