/* ---- Pelo SINAPI: busca e prévia (os dados do SINAPI NÃO ficam no estado) ---- */
const sinDraft = {refs:null, uf:'', base:'', regime:'', q:'', semCusto:false, res:null, off:0, sel:null, prev:null, timer:null};
const REGIME_NOME = {sd:'sem desoneração', cd:'com desoneração', se:'sem encargos sociais'};
const mesAno = b => b ? b.slice(5,7)+'/'+b.slice(0,4) : '';
async function apiLer(url){
  try{
    const r = await fetch(url, {credentials:'same-origin'});
    if(r.status === 401){ location.href = '/conta/login/?next=/'; return null; }
    let j = null; try{ j = await r.json(); }catch(e){}
    if(!r.ok || !j){ toast('err', 'SINAPI', `<div>${esc(j && j.erro || 'Tente de novo em instantes.')}</div>`); return null; }
    return j;
  }catch(e){ toast('err','Sem conexão','<div>Não foi possível falar com o servidor.</div>'); return null; }
}
function sinAjustar(){
  const R = sinDraft.refs || [];
  const ufs = [...new Set(R.map(r=>r.uf))];
  if(!ufs.includes(sinDraft.uf)) sinDraft.uf = ufs.includes(state.obra.uf) ? state.obra.uf : (ufs[0]||'');
  const bases = [...new Set(R.filter(r=>r.uf===sinDraft.uf).map(r=>r.data_base))].sort().reverse();
  if(!bases.includes(sinDraft.base)) sinDraft.base = bases[0]||'';
  const regs = [...new Set(R.filter(r=>r.uf===sinDraft.uf && r.data_base===sinDraft.base).map(r=>r.regime))];
  if(!regs.includes(sinDraft.regime)) sinDraft.regime = regs.includes(state.obra.regimeSinapi) ? state.obra.regimeSinapi : (regs[0]||'');
  return {ufs, bases, regs};
}
async function sinCarregarRefs(){
  if(sinDraft.refs) return;
  const j = await apiLer('/api/sinapi/referencias'); if(!j) return;
  sinDraft.refs = j.referencias; sinDesenhar();
}
function sinapiBloco(){ return `<div id="sin-corpo">${sinCorpo()}</div>`; }
function sinCorpo(){
  if(!sinDraft.refs) return '<p class="formhint">Carregando as referências do SINAPI…</p>';
  if(!sinDraft.refs.length) return '<p class="formhint">Nenhum mês do SINAPI foi carregado ainda. O administrador carrega o arquivo da Caixa (veja o README).</p>';
  const {ufs, bases, regs} = sinAjustar();
  const op = (lista, atual, nome) => lista.map(v=>`<option value="${v}" ${v===atual?'selected':''}>${nome?nome(v):v}</option>`).join('');
  return `<p class="formhint">Composições oficiais do SINAPI (Caixa). Ao usar uma, o Prumo <b>copia</b> a composição e os insumos para a sua obra; o preço fica congelado no orçamento.</p>
    <div class="formgrid">
      <div><label for="sin-uf">UF</label><select id="sin-uf" onchange="sinMudou('uf',this.value)">${op(ufs, sinDraft.uf)}</select></div>
      <div><label for="sin-base">Mês de referência</label><select id="sin-base" onchange="sinMudou('base',this.value)">${op(bases, sinDraft.base, mesAno)}</select></div>
      <div><label for="sin-reg">Regime</label><select id="sin-reg" onchange="sinMudou('regime',this.value)">${op(regs, sinDraft.regime, r=>REGIME_NOME[r]||r)}</select></div>
      <div style="grid-column:span 2;"><label for="sin-q">Buscar serviço</label><input id="sin-q" type="search" placeholder="Ex: alvenaria bloco cerâmico, contrapiso" value="${esc(sinDraft.q)}" oninput="sinDigitou(this.value)"></div>
      <div><label for="f-orc-sqtd">Quantidade</label><input id="f-orc-sqtd" type="number" step="0.01" min="0" inputmode="decimal"></div>
    </div>
    <div id="sin-res">${sinResultados()}</div>
    <div id="sin-prev">${sinPrevia()}</div>
    <p class="formhint">Fonte: SINAPI/Caixa Econômica Federal.</p>`;
}
function sinDesenhar(){
  const el = document.getElementById('sin-corpo'); if(!el) return;
  const qtd = val('f-orc-sqtd'); el.innerHTML = sinCorpo(); const n = document.getElementById('f-orc-sqtd'); if(n && qtd) n.value = qtd;
}
function sinMudou(campo, v){
  sinDraft[campo] = v; sinDraft.res = null; sinDraft.sel = null; sinDraft.prev = null; sinDraft.off = 0;
  sinDesenhar(); if(norm(sinDraft.q).length>=2) sinBuscar();
}
function sinDigitou(v){
  sinDraft.q = v; clearTimeout(sinDraft.timer);
  sinDraft.timer = setTimeout(()=>{ sinDraft.off = 0; sinBuscar(); }, 350);
}
async function sinBuscar(){
  const q = sinDraft.q.trim();
  if(norm(q).length < 2){ sinDraft.res = null; document.getElementById('sin-res').innerHTML = sinResultados(); return; }
  const u = new URLSearchParams({q, uf:sinDraft.uf, base:sinDraft.base, regime:sinDraft.regime, offset:sinDraft.off, limite:10});
  const j = await apiLer('/api/sinapi/composicoes?'+u); if(!j) return;
  if(q !== sinDraft.q.trim()) return;
  sinDraft.res = j; const el = document.getElementById('sin-res'); if(el) el.innerHTML = sinResultados();
}
function sinPagina(d){ sinDraft.off = Math.max(0, sinDraft.off + d*10); sinBuscar(); }
function sinResultados(){
  const r = sinDraft.res;
  if(!r) return norm(sinDraft.q).length ? '' : '<p class="formhint">Digite pelo menos 2 letras para buscar.</p>';
  if(!r.itens.length) return '<div class="empty">Nenhum serviço encontrado com custo nesta referência.</div>';
  return tbl(`<table class="mini sin-res"><thead><tr><th>Código</th><th>Serviço</th><th>Unid.</th><th class="num">Custo SINAPI</th></tr></thead><tbody>
    ${r.itens.map(c=>`<tr onclick="sinVer(${c.codigo})" ${sinDraft.sel===c.codigo?'style="background:var(--accent-soft)"':''}><td class="codigo">${c.codigo}</td><td>${esc(c.descricao)}<div class="codigo">${esc(c.grupo)}</div></td><td class="mono">${esc(c.unidade)}</td><td class="num">${fmtMoney(c.custo)}${c.pct_as>0?` <span class="tag sp" title="Parte do custo usa preço de São Paulo">${Math.round(c.pct_as*100)}% SP</span>`:''}</td></tr>`).join('')}
    </tbody></table>`) + `<div class="row" style="margin:6px 14px;gap:8px;align-items:center;"><span class="codigo">${r.total} resultado(s) · ${sinDraft.off+1}–${sinDraft.off+r.itens.length}</span>
      <button class="ghost" ${sinDraft.off?'':'disabled'} onclick="sinPagina(-1)">Anteriores</button><button class="ghost" ${sinDraft.off+r.itens.length<r.total?'':'disabled'} onclick="sinPagina(1)">Próximos</button></div>`;
}
async function sinVer(codigo){
  sinDraft.sel = codigo; sinDraft.prev = null;
  document.getElementById('sin-prev').innerHTML = '<p class="formhint">Carregando…</p>'; document.getElementById('sin-res').innerHTML = sinResultados();
  const u = new URLSearchParams({uf:sinDraft.uf, base:sinDraft.base, regime:sinDraft.regime});
  const j = await apiLer(`/api/sinapi/composicoes/${codigo}?`+u); if(!j) return;
  sinDraft.prev = j.composicao; document.getElementById('sin-prev').innerHTML = sinPrevia();
}
function sinPrevia(){
  const c = sinDraft.prev; if(!c) return '';
  const q = parseFloat(val('f-orc-sqtd'))||0;
  return `<div class="preview"><div class="tot"><span><b>SINAPI ${c.codigo}</b> · ${esc(c.unidade)}</span><span>Custo SINAPI publicado: <b>${c.custo==null?'—':fmtMoney(c.custo)}</b></span>${c.custo_calculado!=null?`<span>Calculado pelo Prumo: <b>${fmtMoney(c.custo_calculado)}</b></span>`:''}</div>
    <div style="font-size:13px;margin-bottom:6px;">${esc(c.descricao)}</div>

      ${c.itens.map(i=>`<tr><td><span class="codigo">${i.codigo_insumo}</span> ${esc(i.descricao)}</td><td class="mono">${esc(i.unidade)}</td><td class="num">${fmtCoef(i.coef)}</td>
        <td class="num">${i.preco==null?'<span class="tag sp">sem preço</span>':fmtMoney(i.preco)+(i.origem_preco==='sp'?' <span class="tag sp" title="Sem coleta na sua UF: preço de São Paulo">SP</span>':'')}</td></tr>`).join('')}
      </tbody></table>`)}
    <div class="form-actions" style="padding:8px 0 0;"><button class="primary" onclick="sinUsar()">Usar este serviço${q?'':' (informe a quantidade)'}</button></div></div>`;
}
async function sinUsar(){
  const sel = val('f-orc-etapa');
  if(!sel){ erro('Escolha a etapa.'); return; }
  const c = sinDraft.prev, qtd = parseFloat(val('f-orc-sqtd'));
  if(!c){ erro('Busque e escolha um serviço do SINAPI.'); return; }
  if(!(qtd>0)){ erro('A quantidade precisa ser maior que zero.'); return; }
  const etapa = sel.startsWith('id:') ? {etapaId: parseInt(sel.slice(3))} : {etapa: sel.slice(5)};
  const faltam = c.itens.filter(i=>i.preco==null).length;
  const seguir = async ()=>{
    const r1 = await api('POST', '/api/sinapi/importar', {codigo:c.codigo, uf:sinDraft.uf, base:sinDraft.base, regime:sinDraft.regime});
    if(!r1) return;
    const r2 = await api('POST', '/api/orcamento', {...etapa, composicaoId:r1.composicaoId, qtd, observacao: val('f-orc-obs').trim()});
    if(!r2) return;
    const it = state.orcamento.find(i=>i.id===r2.id); if(it) orcDraft.etapa = 'id:'+it.etapaId;
    renderAll(); const fb = document.getElementById('form-orc'); if(fb) fb.open = true;
    toast(faltam ? 'info' : 'ok', 'Serviço do SINAPI adicionado', `<div>${esc(c.descricao)}: ${fmtNum(qtd)} ${esc(c.unidade)}.</div>${(r1.avisos||[]).map(a=>`<div>${esc(a)}</div>`).join('')}`);
  };
  if(faltam) confirmar('Insumos sem preço', `${faltam} insumo(s) desta composição não têm preço no SINAPI e entram com R$ 0,00 até você informar o preço em Cadastros. O orçamento do serviço ficará subestimado até lá. Continuar?`, 'Continuar', seguir);
  else seguir();
}

async function handleAddOrcamento(){
  if(orcDraft.modo==='sinapi'){ sinUsar(); return; }
  const sel = val('f-orc-etapa');
  if(!sel){ erro('Escolha a etapa.'); return; }
  const etapa = sel.startsWith('id:') ? {etapaId: parseInt(sel.slice(3))} : {etapa: sel.slice(5)};
  const observacao = val('f-orc-obs').trim();
  let corpo, resumo;
  if(orcDraft.modo==='comp'){
    const c = compPor(parseInt(val('f-orc-comp'))), qtd = parseFloat(val('f-orc-qtd'));
    if(!c){ erro('Escolha a composição do serviço.'); return; }
    if(!(qtd>0)){ erro('A quantidade precisa ser maior que zero.'); return; }
    corpo = {...etapa, composicaoId:c.id, qtd, servico: val('f-orc-nome').trim() || undefined, observacao};
    resumo = `${esc(c.descricao)}: ${fmtNum(qtd)} ${esc(c.unidade)} · planejado ${fmtMoney(qtd*c.custo)}. Os insumos previstos já estão no serviço.`;
  } else {
    const servico = val('f-orc-servico').trim(), unidade = val('f-orc-unidade').trim(), qtd = parseFloat(val('f-orc-vqtd')), precoUnit = parseFloat(val('f-orc-preco'));
    if(!servico || !unidade){ erro('Preencha o serviço e a unidade.'); return; }
    if(!(qtd>0) || !(precoUnit>0)){ erro('Quantidade e preço unitário precisam ser maiores que zero.'); return; }
    corpo = {...etapa, servico, unidade, qtd, precoUnit, observacao};
    resumo = `${esc(servico)}: planejado ${fmtMoney(qtd*precoUnit)} (por verba).`;
  }
  const r = await api('POST', '/api/orcamento', corpo);
  if(!r) return;
  const it = state.orcamento.find(i=>i.id===r.id);
  if(it) orcDraft.etapa = 'id:'+it.etapaId;
  orcDraft.compId = null; orcDraft.filtro = '';
  renderAll(); const fb = document.getElementById('form-orc'); if(fb) fb.open = true;
  toast('ok', 'Serviço adicionado', `<div>${resumo}</div>`);
}

async function salvarItem(id, verba){
  const d = {etapaId: parseInt(val('p-it-etapa')), servico: val('p-it-serv').trim(), qtd: val('p-it-qtd'), observacao: val('p-it-obs').trim()};

  if(await api('POST', `/api/orcamento/${id}`, d)){ fecharPainel(); toast('ok','Serviço atualizado',''); }

function atualizarPelaComposicao(id){
  const i = state.orcamento.find(x=>x.id===id), c = i && compPor(i.composicaoId); if(!c) return;
  confirmar('Atualizar pela composição?', `O preço passa de ${fmtMoney(i.precoUnit)} para ${fmtMoney(c.custo)} por ${c.unidade}, e os insumos previstos passam a ser os da composição ${c.codigo} de hoje. O orçado da obra muda.`, 'Atualizar', async ()=>{

/* Quantidade de um insumo já comprada (em notas) para um serviço: é o "comprado", não o gasto */
function compradoDoInsumo(itemId, insumoId){
  const mats = new Set(state.materiais.filter(m=>m.insumoId===insumoId).map(m=>m.id));
  return state.notasFiscais.reduce((s,nf)=>s+nf.itens.filter(it=>it.orcamentoItemId===itemId && mats.has(it.materialId)).reduce((a,it)=>a+it.qtd,0),0);
}
const compradoValorDoItem = itemId => state.notasFiscais.reduce((s,nf)=>s+nf.itens.filter(it=>it.orcamentoItemId===itemId).reduce((a,it)=>a+it.qtd*it.valorUnit,0),0);
const gastoMaterialDoItem = itemId => state.pedidos.filter(p=>p.tipo==='servico' && p.orcamentoItemId===itemId).reduce((s,p)=>s+p.valor,0);

async function handleSalvarNFDraft(){

  nfDraft.tipo = val('f-nf-tipo') || nfDraft.tipo;

/* Mostra o previsto e o comprado para o material escolhido naquele serviço */
function atualizarDicaConsumo(){
  const el = document.getElementById('dica-consumo'); if(!el) return;
  if(val('f-cons-tipo')!=='servico'){ el.innerHTML = 'Esta baixa reduz o saldo, mas não entra no gasto de nenhum serviço.'; return; }
  const item = state.orcamento.find(i=>i.id===parseInt(val('f-cons-item')));
  const mat = state.materiais.find(m=>m.id===parseInt(val('f-cons-mat')));
  if(!item || !mat){ el.innerHTML = ''; return; }
  const prev = mat.insumoId ? item.insumos.find(p=>p.insumoId===mat.insumoId) : null;
  if(!prev){ el.innerHTML = item.insumos.length ? `Esse material não está previsto na composição de "${esc(item.servico)}". Confira se o serviço está certo.` : ''; return; }
  const previsto = prev.coef*item.qtd, usado = usadoDoInsumo(item.id, mat.insumoId), comprado = compradoDoInsumo(item.id, mat.insumoId), agora = parseFloat(val('f-cons-qtd'))||0;
  const total = usado + agora;
  el.innerHTML = `Previsto para este serviço: <b>${fmtNum(previsto)} ${esc(mat.unidade)}</b> · comprado em notas: ${fmtNum(comprado)} · já baixado: ${fmtNum(usado)}${agora?` · com esta baixa: <b class="${total>previsto?'over':''}">${fmtNum(total)}</b>${total>previsto?' (acima do previsto)':''}`:''}`;
}

function handleBaixa(){
  const tipo = val('f-cons-tipo') || 'servico';
  const orcamentoItemId = parseInt(val('f-cons-item')) || null, materialId = parseInt(val('f-cons-mat'));
  const qtd = parseFloat(val('f-cons-qtd')), data = val('f-cons-data'), observacao = (val('f-cons-obs')||'').trim();
  if(!materialId || !data){ erro('Escolha o material e a data.'); return; }
  if(tipo==='servico' && !orcamentoItemId){ erro('Escolha o serviço em que o material foi usado.'); return; }
  if(tipo!=='servico' && !observacao){ erro('Descreva o motivo da baixa.'); return; }
  if(!(qtd>0)){ erro('Informe a quantidade baixada (maior que zero).'); return; }
  const mat = state.materiais.find(m=>m.id===materialId);
  const item = state.orcamento.find(i=>i.id===orcamentoItemId);
  const executar = async (parcial)=>{
    const r = await api('POST', '/api/consumos', {tipo, orcamentoItemId: tipo==='servico' ? orcamentoItemId : null, observacao: tipo==='servico' ? '' : observacao, materialId, qtd, data, aceitarParcial: !!parcial});
    if(!r) return;
    const m2 = state.materiais.find(m=>m.id===materialId);
    toast('ok','Baixa registrada', `<ul><li>Estoque de ${esc(m2.nome)}: agora ${fmtNum(m2.saldo)} ${esc(m2.unidade)}</li>${tipo==='servico' && item ? `<li>${fmtMoney(r.valor)} somados ao realizado de "${esc(item.servico)}"</li>` : `<li>${fmtMoney(r.valor)} baixados como ${esc(tipoBaixaNome(tipo).toLowerCase())} (não entra no gasto de nenhum serviço)</li>`}</ul>`);
  };
  if(mat.saldo < qtd){
    confirmar('Estoque insuficiente', `Você pediu ${fmtNum(qtd)} ${mat.unidade}, mas o estoque tem só ${fmtNum(mat.saldo)} ${mat.unidade}. Se a quantidade está certa, falta lançar algum documento de entrada. Quer baixar só o que há no estoque?`, `Baixar ${fmtNum(mat.saldo)} ${mat.unidade}`, ()=>executar(true));
    return;
  }
  executar(false);
}

async function handleAddEmpreiteiro(){
  const nome = val('f-emp-nome').trim(), contato = val('f-emp-contato').trim(), especialidade = val('f-emp-esp').trim();
  if(!nome){ erro('Informe o nome do empreiteiro.'); return; }
  if(await api('POST', '/api/empreiteiros', {nome, contato, especialidade})) toast('ok','Empreiteiro cadastrado', `<div>Agora crie um contrato para ${esc(nome)}.</div>`);
}

async function handleAddContrato(){
  const empreiteiroId = parseInt(val('f-ctr-emp')), orcamentoItemId = parseInt(val('f-ctr-item'));
  const valorContratado = parseFloat(val('f-ctr-valor')), formaPagamento = val('f-ctr-forma').trim() || 'A combinar';
  if(!empreiteiroId || !orcamentoItemId){ erro('Escolha o empreiteiro e o serviço.'); return; }
  if(!(valorContratado>0)){ erro('Informe o valor do contrato.'); return; }
  const item = state.orcamento.find(i=>i.id===orcamentoItemId);
  const plan = planejadoDoItem(item);
  if(!(await api('POST', '/api/contratos', {empreiteiroId, orcamentoItemId, valorContratado, formaPagamento}))) return;
  toast(valorContratado > plan ? 'info' : 'ok', 'Contrato cadastrado',
    valorContratado > plan ? `<div>Atenção: o contrato (${fmtMoney(valorContratado)}) é maior que todo o orçado para "${esc(item.servico)}" (${fmtMoney(plan)}). Esse serviço vai estourar.</div>` : `<div>Agora registre medições conforme o serviço avança.</div>`);
}

async function handleAddMedicao(){
  const contratoId = parseInt(val('f-med-contrato')), data = val('f-med-data'), percentual = parseFloat(val('f-med-pct'));
  if(!contratoId || !data){ erro('Escolha o contrato e a data.'); return; }
  if(!(percentual>0)){ erro('Informe o % executado no período (maior que zero).'); return; }
  const ja = pctMedido(contratoId);
  if(ja + percentual > 100.0001){ erro(`Esse contrato já tem ${fmtPct(ja)} medido. O máximo que dá para medir agora é ${fmtPct(100-ja)}.`); return; }
  const r = await api('POST', '/api/medicoes', {contratoId, data, percentual});
  if(r) toast('ok','Medição registrada', `<div>${fmtPct(percentual)} = ${fmtMoney(r.valor)}. Ela fica esperando aprovação. Só depois de aprovada vira gasto e gera pagamento.</div>`);
}

function handleAprovarMedicao(id){
  const m = state.medicoes.find(x=>x.id===id);
  const c = state.contratos.find(x=>x.id===m.contratoId);
  const item = c ? state.orcamento.find(i=>i.id===c.orcamentoItemId) : null;
  confirmar('Aprovar medição?', `Confirme que ${fmtPct(m.percentual)} do serviço foi mesmo executado. Isso lança ${fmtMoney(m.valor)} como gasto${item?' de "'+item.servico+'"':''} e programa o pagamento ao empreiteiro.`, 'Aprovar', async ()=>{
    if(await api('POST', `/api/medicoes/${id}/aprovar`)) toast('ok','Medição aprovada', `<ul><li>${fmtMoney(m.valor)} somados ao realizado${item?' de "'+esc(item.servico)+'"':''}</li><li>Pagamento programado no Financeiro</li></ul>`);
  });
}

    </div>

    <div class="card" id="sec-pag">
      <h3>Pagamentos</h3>
      ${state.pagamentos.length ? tbl(`<table><thead><tr><th>Vencimento</th><th>Tipo</th><th>Origem</th><th>Serviço</th><th class="num">Valor</th><th>Situação</th><th></th></tr></thead><tbody>
        ${ordenados.map(p=>{
          const item = state.orcamento.find(i=>i.id===p.orcamentoItemId);

            <td>${pill(tipo,'neutral')}</td>

            <td class="num">${fmtMoney(p.valor)}</td>
            <td>${p.status==='pago' ? pill('Pago em '+fmtDate(p.dataPagamento),'ok') : vencido(p) ? pill('Vencido','danger') : pill('A pagar','warn')}</td>
            <td style="white-space:nowrap;">${p.status==='programado' ? `<button class="ghost" onclick="handleMarcarPago(${p.id})">Marcar como pago</button>${p.tipo==='avulso' ? ` <button class="link del" onclick="excluirPagamento(${p.id})">excluir</button>` : ''}` : ''}</td>

      <details class="formbox" id="form-pag">

          </div>
          <div><label for="f-pag-valor">Valor (R$)</label><input id="f-pag-valor" type="number" step="0.01" inputmode="decimal"></div>
          <div><label for="f-pag-data">Vencimento</label><input id="f-pag-data" type="date" value="${todayStr()}"></div>

async function handleMarcarPago(id){
  const p = state.pagamentos.find(x=>x.id===id);
  if(await api('POST', `/api/pagamentos/${id}/pagar`)) toast('ok','Pagamento confirmado', `<div>${esc(p.origem)}: ${fmtMoney(p.valor)} saiu do "falta pagar".</div>`);
}

function excluirPagamento(id){
  confirmar('Excluir pagamento avulso?', 'Ele sai da lista de contas a pagar e, se estava ligado a um serviço, deixa de contar como gasto dele.', 'Excluir', async ()=>{
    if(await api('DELETE', `/api/pagamentos/${id}`)) toast('ok','Pagamento excluído','');
  }, true);
}

async function handleAddPagamentoAvulso(){
  const desc = val('f-pag-desc').trim();
  const orcamentoItemId = val('f-pag-item') ? parseInt(val('f-pag-item')) : null;
  const valor = parseFloat(val('f-pag-valor')), data = val('f-pag-data');
  if(!desc || !data){ erro('Preencha a descrição e o vencimento.'); return; }
  if(!(valor>0)){ erro('Informe o valor (maior que zero).'); return; }
  const item = state.orcamento.find(i=>i.id===orcamentoItemId);
  if(!(await api('POST', '/api/pagamentos', {descricao: desc, orcamentoItemId, valor, data}))) return;
  toast('ok','Pagamento lançado', item ? `<div>${fmtMoney(valor)} também somados ao realizado de "${esc(item.servico)}".</div>` : `<div>Despesa geral: entra no caixa, mas não conta como gasto de nenhum serviço.</div>`);
}

/* ---------------------- Excel: exportar / importar ---------------------- */
async function salvarArquivo(wb, nome){
  let downloads = null;
  try{ downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }catch(e){}
  if(downloads){
    try{
      const buf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
      await downloads.save({filename:nome, data:buf});
      toast('ok','Arquivo pronto', `<div>${esc(nome)}</div>`);
    }catch(err){
      if(err && err.code==='declined') return;
      toast('err','Não foi possível baixar', `<div>${esc(err && err.message || 'O download foi recusado nesta visualização.')}</div>`);
    }
    return;
  }
  try{ XLSX.writeFile(wb, nome); }
  catch(e){ toast('err','Download indisponível aqui', '<div>Abra a página no navegador, fora da pré-visualização, para baixar arquivos.</div>'); }
}

/* Cabeçalhos aceitos com ou sem acento/espaço: "Serviço", "Preço Unitário", "PrecoUnitario"... */
const normKey = k => String(k).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function linhaNormalizada(r){ const o = {}; Object.keys(r).forEach(k=>{ o[normKey(k)] = r[k]; }); return o; }
const pick = (r, ...keys) => { for(const k of keys){ if(r[k]!==undefined && r[k]!=='') return r[k]; } return ''; };
/* Datas: aceita AAAA-MM-DD, DD/MM/AAAA e o número de série que o Excel grava */
function normData(v, padrao){
  if(v===undefined || v===null || v==='') return padrao;
  if(typeof v==='number'){ const d = new Date(Math.round((v-25569)*86400000)); return d.toISOString().slice(0,10); }
  const s = String(v).trim();
  const br = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(br) return br[3]+'-'+br[2].padStart(2,'0')+'-'+br[1].padStart(2,'0');
  return s.slice(0,10);
}
const num = v => { if(typeof v==='number') return v; const s = String(v||'').trim(); if(!s) return 0; const n = parseFloat(s.includes(',') ? s.replace(/\./g,'').replace(',','.') : s); return isNaN(n)?0:n; };
const idOr = (v, novo) => { const n = parseInt(v); return isNaN(n) ? novo() : n; };
const maxId = arr => arr.length ? Math.max(...arr.map(x=>parseInt(x.id)||0)) : 0;

function handleImportarPlanilha(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    let novo, abas = [];
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      const nomes = {}; wb.SheetNames.forEach(n=>{ nomes[normKey(n)] = n; });
      const sheet = name => { const real = nomes[normKey(name)]; if(!real) return null; abas.push(real); return XLSX.utils.sheet_to_json(wb.Sheets[real], {defval:''}).map(linhaNormalizada); };
      novo = JSON.parse(JSON.stringify(state));
      const prevState = state; state = novo; /* uid() usa o novo estado */

      const obra = sheet('Obra');
      if(obra && obra[0]){ const r = obra[0]; novo.obra = {nome:String(r.nome||novo.obra.nome), cliente:String(r.cliente||novo.obra.cliente), prazo:normData(r.prazo, novo.obra.prazo), valorContratado:num(r.valorcontratado)||novo.obra.valorContratado}; }

      const orc = sheet('Orcamento');
      if(orc){
        novo.orcamento = orc.map(r=>({
          id: idOr(r.id, uid), etapa:String(pick(r,'etapa')).trim(), servico:String(pick(r,'servico')).trim(), observacao:String(pick(r,'observacao','insumo')).trim(), codigo:String(pick(r,'codigocomposicao','codigo')).trim(),
          unidade:String(pick(r,'unidade','unid')).trim(), qtd:num(pick(r,'quantidade','qtd')), precoUnit:num(pick(r,'precounitario','precounit','preco','valorunitario'))
        })).map(i=>{ if(!i.servico && i.codigo){ const c = (state.composicoes||[]).find(x=>norm(x.codigo)===norm(i.codigo)); if(c) i.servico = c.descricao; } return i; })
          .filter(i=>i.etapa && i.servico);
      }
      const et = sheet('EtapaAvanco');
      if(et){ novo.etapaAvanco = {}; et.forEach(r=>{ if(r.etapa) novo.etapaAvanco[String(r.etapa)] = num(r.avancofisicopct); }); }
      [...new Set(novo.orcamento.map(i=>i.etapa))].forEach(x=>{ if(!(x in novo.etapaAvanco)) novo.etapaAvanco[x]=0; });

      const forn = sheet('Fornecedores'); if(forn) novo.fornecedores = forn.map(r=>({id:idOr(r.id,uid), nome:String(r.nome||''), contato:String(r.contato||'')})).filter(f=>f.nome);
      const mat = sheet('Materiais'); if(mat) novo.materiais = mat.map(r=>({id:idOr(r.id,uid), codigoInsumo:String(r.codigoinsumo||''), nome:String(r.nome||''), unidade:String(r.unidade||''), saldo:num(r.saldo), custoMedio:num(r.customedio)})).filter(m=>m.nome);
      const nfs = sheet('NotasFiscais');
      if(nfs){
        const g = {};
        nfs.forEach(r=>{ const key = r.id || r.numero; if(!key) return;
          if(!g[key]) g[key] = {id:idOr(r.id,uid), numero:String(r.numero||''), tipo:String(r.tipo||'nota_fiscal'), fornecedorId:parseInt(r.fornecedorid)||null, data:normData(r.data, todayStr()), itens:[]};
          g[key].itens.push({materialId:parseInt(r.materialid)||null, orcamentoItemId:parseInt(r.orcamentoitemid)||null, qtd:num(r.quantidade), valorUnit:num(r.valorunitario)}); });
        novo.notasFiscais = Object.values(g);
      }
      const ped = sheet('ConsumoMaterial'); if(ped) novo.pedidos = ped.map(r=>({id:idOr(r.id,uid), tipo:String(r.tipo||'servico'), observacao:String(r.observacao||''), orcamentoItemId:parseInt(r.orcamentoitemid)||null, materialId:parseInt(r.materialid)||null, qtd:num(r.quantidade), qtdSolicitada:num(r.quantidadesolicitada)||num(r.quantidade), valor:num(r.valor), data:normData(r.data, todayStr())}));
      const emp = sheet('Empreiteiros'); if(emp) novo.empreiteiros = emp.map(r=>({id:idOr(r.id,uid), nome:String(r.nome||''), contato:String(r.contato||''), especialidade:String(r.especialidade||'')})).filter(x=>x.nome);
      const ctr = sheet('Contratos'); if(ctr) novo.contratos = ctr.map(r=>({id:idOr(r.id,uid), empreiteiroId:parseInt(r.empreiteiroid)||null, orcamentoItemId:parseInt(r.orcamentoitemid)||null, valorContratado:num(r.valorcontratado), formaPagamento:String(r.formapagamento||'')}));
      const med = sheet('Medicoes'); if(med) novo.medicoes = med.map(r=>({id:idOr(r.id,uid), contratoId:parseInt(r.contratoid)||null, data:normData(r.data, todayStr()), percentual:num(r.percentualexecutado), valor:num(r.valor), status:String(r.status||'pendente')}));
      const pag = sheet('Pagamentos'); if(pag) novo.pagamentos = pag.map(r=>({id:idOr(r.id,uid), tipo:String(r.tipo||'avulso'), origem:String(r.origem||''), orcamentoItemId:r.orcamentoitemid?parseInt(r.orcamentoitemid):null, valor:num(r.valor), dataProgramada:normData(r.dataprogramada, todayStr()), dataPagamento:r.datapagamento?normData(r.datapagamento,null):null, status:String(r.status||'programado'), medicaoId:r.medicaoid?parseInt(r.medicaoid):null}));

      state = prevState;
      if(!abas.length) throw new Error('sem abas reconhecidas');
      ['notasFiscais:nf','pedidos:pedido','contratos:contrato','medicoes:medicao','pagamentos:pagamento'].forEach(p=>{ const [k,n] = p.split(':'); novo.nextIds[n] = Math.max(novo.nextIds[n]||1, maxId(novo[k])+1); });
      const todos = [].concat(novo.orcamento, novo.fornecedores, novo.materiais, novo.empreiteiros);
      novo.seq = Math.max(novo.seq||1000, maxId(todos));
    }catch(err){
      console.error(err);
      toast('err','Não foi possível ler essa planilha', '<div>Use o modelo de orçamento ou um arquivo exportado pelo próprio sistema. As abas precisam ter os nomes originais (ex.: "Orcamento").</div>');
      evt.target.value = ''; return;
    }
    evt.target.value = '';

    /* Lançamentos que ficariam sem serviço por causa da troca do orçamento */
    const ids = new Set(novo.orcamento.map(i=>i.id));
    const orfaos = novo.pedidos.filter(p=>p.orcamentoItemId && !ids.has(p.orcamentoItemId)).length
      + novo.contratos.filter(c=>c.orcamentoItemId && !ids.has(c.orcamentoItemId)).length
      + novo.pagamentos.filter(p=>p.orcamentoItemId && !ids.has(p.orcamentoItemId)).length;
    const aplicar = async ()=>{
      if(!(await api('POST', '/api/importar', {estado: novo}))) return;
      nfDraft = novoNfDraft();
      irPara('dashboard');
      toast('ok','Planilha importada', `<div>Abas atualizadas: ${abas.map(esc).join(', ')}. ${state.orcamento.length} serviços no orçamento.</div>`);
    };
    if(orfaos>0){
      confirmar('O orçamento novo não tem alguns serviços antigos', `${orfaos} lançamento(s) já feitos estão ligados a serviços que não existem na planilha. Consumos e contratos desses serviços serão descartados, e pagamentos passam a ser despesa geral. Para manter tudo ligado, importe a planilha exportada pelo sistema, que guarda os IDs.`, 'Importar mesmo assim', aplicar, true);
    } else aplicar();
  };
  reader.readAsArrayBuffer(file);
}

    inp.addEventListener('change', e=>{
      const k = e.target.dataset.obra;
      if(k==='nome' && !e.target.value.trim()){ erro('O nome da obra não pode ficar vazio.'); e.target.value = state.obra.nome; return; }
      api('POST', '/api/obra', {[k]: k==='valorContratado' ? (parseFloat(e.target.value)||0) : e.target.value}).then(r=>{ if(r) toast('ok','Dados da obra salvos',''); });
    });
  });
  document.querySelectorAll('details.intro').forEach(d=> d.addEventListener('toggle', ()=> setPref('intro-'+d.dataset.intro, d.open)));
  if(currentTab==='orcamento'){ atualizarPreviewOrc(); if(orcDraft.modo==='sinapi') sinCarregarRefs(); }
  if(currentTab==='baixa') atualizarDicaConsumo();
  salvar();
}

renderTopbar();
document.getElementById('main').innerHTML = '<div class="empty">Carregando a sua obra…</div>';
fetch('/api/estado', {credentials: 'same-origin'}).then(async r=>{
  if(r.status === 401){ location.href = '/conta/login/?next=/'; return; }
  const j = await r.json();
  state = j.estado;
  nfDraft = novoNfDraft();
  currentTab = prefs().tab || 'inicio';
  if(prefs().menuRecolhido) document.getElementById('frame').classList.add('menu-collapsed');
  renderAll();
}).catch(()=>{
  document.getElementById('main').innerHTML = '<div class="empty">Não foi possível carregar a obra. Confira a internet e recarregue a página.</div>';
});
</script>

</body>
</html>
