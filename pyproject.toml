[project]
name = "obrasimples"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
    "Django==5.1.4",
    "whitenoise==6.8.2",
    "dj-database-url==2.3.0",
    "gunicorn==23.0.0",
    "psycopg[binary]==3.2.3",
]

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
build = "python build.py"
