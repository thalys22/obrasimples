<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block titulo %}ObraSimples{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1C2533;--muted:#687384;--line:#E3E6EA;--bg:#F3F4F6;--white:#fff;--accent:#E07B24;--green:#1F4A35;--red:#C2443A;--red-soft:#F8E0DD;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  .lado{background:var(--green);color:#D5E6DC;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
  .lado h2{color:#fff;font-size:30px;line-height:1.2;margin:0 0 12px;max-width:16ch}
  .lado p{margin:0;max-width:40ch;line-height:1.6}
  .marca{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:20px}
  .form-area{display:grid;place-items:center;padding:32px 16px}
  .card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:32px 28px;width:100%;max-width:400px}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 22px}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px}
  input{width:100%;height:42px;border:1px solid #C9CED6;border-radius:6px;padding:0 12px;font:inherit;font-size:15px}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #FCEFE3}
  button{margin-top:22px;width:100%;height:44px;border:none;border-radius:999px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
  button:hover{background:#C66A1C}
  .erro{background:var(--red-soft);color:#7A2A24;border-left:3px solid var(--red);padding:10px 12px;border-radius:4px;font-size:13.5px;margin-bottom:6px}
  .ajuda{font-size:12.5px;color:var(--muted);margin-top:18px;line-height:1.5}
  .ajuda a,.voltar{color:var(--accent);font-weight:600;text-decoration:none}
  ul.errorlist{list-style:none;margin:6px 0 0;padding:0;color:var(--red);font-size:12.5px}
  .helptext{display:block;font-size:12px;color:var(--muted);margin-top:4px}
  .helptext ul{margin:4px 0 0;padding-left:16px}
  @media(max-width:800px){body{grid-template-columns:1fr}.lado{padding:24px 16px}.lado h2{font-size:22px}.lado .texto{display:none}}
</style>
</head>
<body>
  <aside class="lado">
    <div class="marca">
      <svg width="34" height="34" viewBox="0 0 30 30" fill="none" aria-hidden="true"><rect width="30" height="30" rx="6" fill="#1C2533"/><path d="M7 22 L15 8 L23 22" stroke="#fff" stroke-width="2.2" fill="none" stroke-linejoin="round"/><path d="M11 22 L15 15 L19 22" stroke="#E07B24" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
      ObraSimples
    </div>
    <div class="texto">
      <h2>Orçado, comprado, usado e pago. Tudo ligado.</h2>
      <p>Controle de obra para pequenas construtoras, sem a complexidade de um ERP.</p>
    </div>
    <p class="texto" style="font-size:12px;opacity:.7">Protótipo em teste</p>
  </aside>
  <main class="form-area"><div class="card">{% block conteudo %}{% endblock %}</div></main>
</body>
</html>
